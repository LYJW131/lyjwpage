name: Open build PR

on:
  push:
    branches: ["claude/build-*"]

permissions:
  contents: read

concurrency:
  group: build-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 须与 shared/build-routine.ts 的分支前缀和 runId 格式同步：/build 页面按同一个分支名认回 PR。
      - name: Read run id
        id: run
        env:
          REF: ${{ github.ref_name }}
        run: |
          run_id=${REF#claude/build-}
          if [[ "$run_id" =~ ^[a-z0-9]{8}$ ]]; then
            echo "id=$run_id" >> "$GITHUB_OUTPUT"
          else
            echo "Skip: $REF is not a /build run branch"
          fi

      - uses: actions/create-github-app-token@v3
        if: steps.run.outputs.id != ''
        id: app
        with:
          client-id: Iv23liSmKTDKh0bxIfzB
          private-key: ${{ secrets.AVATAR_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      # routine 只推分支；PR 由 App 开，作者是 lyjw131[bot]。标题、正文取推上来的最后一个提交。
      - name: Open pull request
        if: steps.run.outputs.id != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REF: ${{ github.ref_name }}
          RUN_ID: ${{ steps.run.outputs.id }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          existing=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=all&head=$GITHUB_REPOSITORY_OWNER:$REF" --jq length)
          if [ "$existing" != "0" ]; then
            echo "A PR for $REF already exists"
            exit 0
          fi
          title=$(printf '%s\n' "$MESSAGE" | head -n 1)
          body=$(printf '%s\n' "$MESSAGE" | tail -n +3)
          body=$(printf '%s\n\nBuild-Run: %s\n' "$body" "$RUN_ID")
          gh api -X POST "repos/$GITHUB_REPOSITORY/pulls" \
            -f base=main -f head="$REF" -f title="$title" -f body="$body" --jq .html_url
