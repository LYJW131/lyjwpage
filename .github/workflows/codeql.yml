# advanced setup 与 default setup 不能同时开启，否则 GitHub 拒收 SARIF。
name: CodeQL

on:
  push:
    branches: [main, dev]
  # 两项 Analyze 是 main 的必需检查，分支保护只认 pull_request 等事件出的检查、不认 workflow_dispatch；
  # 有意不在 PR 每次推送时扫：合并前给 PR 打 codeql 标签才扫，打上之后的推送也扫
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:
  schedule:
    - cron: "27 7,19 * * *"

permissions:
  contents: read
  security-events: write
  actions: read
  packages: read

jobs:
  changes:
    if: >-
      github.event_name != 'pull_request' || (
        contains(github.event.pull_request.labels.*.name, 'codeql') &&
        (github.event.action != 'labeled' || github.event.label.name == 'codeql'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      languages: ${{ steps.pick.outputs.languages }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            javascript-typescript:
              - "**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,vue,html,htm}"
              - "**/tsconfig*.json"
              - .github/workflows/codeql.yml
            actions:
              - .github/workflows/**
              - "**/action.{yml,yaml}"

      # 只有推 main / dev 按改动过滤；PR、定时扫和手动触发都两种语言全扫，PR 上是必需检查，不能按改动跳过
      - id: pick
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != push ]; then
            CHANGED='["javascript-typescript","actions"]'
          fi
          echo "languages=${CHANGED:-[]}" >> "$GITHUB_OUTPUT"

  analyze:
    needs: changes
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # 并发放在任务上：PR 上打别的标签或没打 codeql 时的推送也会起一次运行（任务全跳过），放在工作流上会把正在扫的那次取消掉
    concurrency:
      group: codeql-${{ github.ref }}-${{ matrix.language }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]

    # 没改到这门语言时只跳过步骤、不跳过任务：跳过的 matrix 任务不展开，检查名会停在未展开的模板上
    env:
      SCAN: ${{ contains(fromJSON(needs.changes.outputs.languages), matrix.language) }}
    steps:
      - uses: actions/checkout@v5
        if: env.SCAN == 'true'

      - uses: github/codeql-action/init@v4
        if: env.SCAN == 'true'
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        if: env.SCAN == 'true'
        with:
          category: "/language:${{ matrix.language }}"
          upload-database: false
