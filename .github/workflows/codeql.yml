# advanced setup 与 default setup 不能同时开启，否则 GitHub 拒收 SARIF。
name: CodeQL

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
  # 不跑 PR：每次推送都等扫描拖慢迭代，改由合入后与每天两次定时扫（北京时间 03:27 / 15:27）兜底
  schedule:
    - cron: "27 7,19 * * *"

permissions:
  contents: read
  security-events: write
  actions: read
  packages: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      languages: ${{ steps.pick.outputs.languages }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            javascript-typescript:
              - "**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,vue,html,htm}"
              - "**/tsconfig*.json"
              - .github/workflows/codeql.yml
            actions:
              - .github/workflows/**
              - "**/action.{yml,yaml}"

      # 只有推 main / dev 按改动过滤；定时扫和手动触发都两种语言全扫
      - id: pick
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != push ]; then
            CHANGED='["javascript-typescript","actions"]'
          fi
          echo "languages=${CHANGED:-[]}" >> "$GITHUB_OUTPUT"

  analyze:
    needs: changes
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]

    # 没改到这门语言时只跳过步骤、不跳过任务：跳过的 matrix 任务不展开，检查名会停在未展开的模板上
    env:
      SCAN: ${{ contains(fromJSON(needs.changes.outputs.languages), matrix.language) }}
    steps:
      - uses: actions/checkout@v5
        if: env.SCAN == 'true'

      - uses: github/codeql-action/init@v4
        if: env.SCAN == 'true'
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        if: env.SCAN == 'true'
        with:
          category: "/language:${{ matrix.language }}"
          upload-database: false
