# 只扫 JS/TS 和 Actions，不扫 apps/ios 里的 Swift：
# 扫 Swift 要在 macOS job 里自己 xcodegen 再对着模拟器编（默认 autobuild 找不到
# 故意不入库的 .xcodeproj），那个 job 很慢，会把整条 CodeQL 拖着不出结果。
# 要加回来，记得 brew 必须在 init 之前（init 注入 DYLD_INSERT_LIBRARIES，brew 会拒装），
# 编译必须在 init 之后（靠 tracing 编译器抽 Swift）。
#
# 用 advanced setup，和 GitHub 的 CodeQL default setup 不能同时开：
# advanced 交上去的 SARIF 会被拒（"cannot be processed when the default
# setup is enabled"），所以仓库设置里 default setup 要保持关闭。
name: CodeQL

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    # 跟默认配置一样每周跑一次，免得某次推送没扫到
    - cron: "27 4 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read
  packages: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]

    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
