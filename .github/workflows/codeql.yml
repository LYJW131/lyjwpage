# advanced setup 与 default setup 不能同时开启，否则 GitHub 拒收 SARIF。
name: CodeQL

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - .github/github-avatar.sha256
  pull_request:
  schedule:
    - cron: "27 4 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read
  packages: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # 仓库变量 SELF_HOSTED_RUNNER=on 时走自建 runner；条件与 ci.yml 一致
    runs-on: ${{ vars.SELF_HOSTED_RUNNER == 'on' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'claude/build-') && github.event.pull_request.user.login != 'lyjw131[bot]')) && fromJSON('["self-hosted","linux","x64","lyjwpage"]') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]

    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
