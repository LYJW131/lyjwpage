name: Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]

permissions: {}

# 只改标题或指派人的 edited（描述和目标分支都没变）、贴摘 needs-judge 与 skip-verify 以外的标签，进另一个组：组在 job 的 if 之前就生效，同组会顶掉正在跑的验证
concurrency:
  group: verify-${{ github.event.pull_request.number }}${{ ((github.event.action == 'edited' && github.event.changes.body == null && github.event.changes.base == null) || ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'needs-judge' && github.event.label.name != 'skip-verify')) && '-noop' || '' }}
  cancel-in-progress: true

env:
  PR: ${{ github.event.pull_request.number }}

jobs:
  plan:
    # 只改标题不重验；改了描述（验证清单、lyjw 原话）、目标分支或 needs-judge 标签才重跑。
    # 贴着 skip-verify 不派验证员和判定员（lyjw 定的：改立绘这类和站点 UI 关系不大的 PR，合并前手动验）；摘掉它就照常验一次。
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'skip-verify') &&
      (github.event.action != 'edited' || github.event.changes.body != null || github.event.changes.base != null) &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'needs-judge' ||
        (github.event.action == 'unlabeled' && github.event.label.name == 'skip-verify'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      need: ${{ steps.plan.outputs.need }}
      judge: ${{ steps.plan.outputs.judge }}
      ui: ${{ steps.plan.outputs.ui }}
      head: ${{ steps.plan.outputs.head }}
      base: ${{ steps.plan.outputs.base }}
    steps:
      # 沿用回执要比上次回执的提交和 head：要完整历史与 origin/main
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      # 判断「只改了注释」要 TypeScript 解析器；只装这一个包，不跑整仓 pnpm install
      - name: Install TypeScript
        run: npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/ts" "typescript@$(node -p 'require("./package.json").devDependencies.typescript')"
      - id: plan
        run: node scripts/verify-action.ts plan --pr "$PR"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMENT_ONLY_REPO: ${{ runner.temp }}/ts
          EVENT_ACTION: ${{ github.event.action }}

  verify:
    needs: plan
    if: needs.plan.outputs.need != ''
    runs-on: ubuntu-latest
    timeout-minutes: 105
    # 只读令牌：验证员能跑任意命令，回执由 publish job 发。
    # id-token: write 供 verify-agent 用 GitHub OIDC 换取短期 Anthropic 令牌：fork PR 不授予该权限，
    # 本 job 中所有非 verify-agent 步骤均清空 ACTIONS_ID_TOKEN_REQUEST_*，ai Worker 另只认 main 上 build.yml 签的令牌。
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
      id-token: write
    outputs:
      result: ${{ steps.pi.outputs.structured_output }}
      read: ${{ steps.prompt.outputs.read }}
      # proof、ci 步骤被杀或抛错时没有输出，记成 error，回执里照样显示「没跑成」「没查到」
      proof: ${{ steps.proof.outputs.proof || (steps.proof.outcome == 'failure' && '{"verdict":"error","tests":[]}') || '' }}
      ci: ${{ steps.ci.outputs.ci || (steps.ci.outcome == 'failure' && 'error') || '' }}
    env:
      OUT: verify-out
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
      - uses: ./.github/actions/verify-tools
        timeout-minutes: 14
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        with:
          browsers: "true"
      # actionlint 只是验证员的一件工具，下载失败不该拖垮整个验证
      - name: Install actionlint
        continue-on-error: true
        timeout-minutes: 3
        run: |
          curl -fsSL -m 60 -o "$RUNNER_TEMP/actionlint.tgz" "https://github.com/rhysd/actionlint/releases/download/v$V/actionlint_${V}_linux_amd64.tar.gz"
          echo "$SHA  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          sudo tar xzf "$RUNNER_TEMP/actionlint.tgz" -C /usr/local/bin actionlint
        env:
          V: 1.7.12
          SHA: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
      # WebKit 的系统依赖（一百多个 apt 包）只在界面档装。runner 默认的 azure 镜像时常卡住不报错（一次挂了 40 分钟）：
      # timeout 要放在 sudo 里面才杀得掉 apt-get、放开 dpkg 锁；重试前从镜像表删掉 azure，走 archive.ubuntu.com
      - name: Install browser system deps
        if: needs.plan.outputs.ui == 'true'
        timeout-minutes: 12
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        run: |
          deps() { sudo timeout -k 10 300 "$(command -v playwright)" install-deps chromium webkit; }
          deps || {
            sudo dpkg --configure -a
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            deps
          }
      - id: preview
        if: needs.plan.outputs.ui == 'true'
        timeout-minutes: 21
        run: node scripts/verify-action.ts wait-preview --pr "$PR" --timeout-min 20
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
      # 脚本能跑的不交给模型：撤回证明在这里跑，结果写进提示词与回执。这一步跑 PR 的测试，不给令牌
      - id: proof
        timeout-minutes: 10
        continue-on-error: true
        run: node scripts/verify-action.ts proof --pr "$PR" --base "origin/$BASE" --out-dir "$RUNNER_TEMP/verify-out"
        env:
          BASE: ${{ needs.plan.outputs.base }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
      - id: prompt
        run: node scripts/verify-action.ts prompt --role verifier --pr "$PR" --preview "$PREVIEW" --out-dir "$RUNNER_TEMP/verify-out"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW: ${{ steps.preview.outputs.preview }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
      # 拿凭据的 action 用默认分支上的版本：PR 能改仓库里那份，前面跑过的 PR 代码也能改工作区里那份
      # 先删掉同名目录：前面跑过的 PR 代码可能预先放了带钩子的 .git 或指出去的符号链接
      - id: clean
        run: rm -rf .verify-agent-main
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
      - uses: actions/checkout@v5
        id: trusted
        if: steps.clean.outcome == 'success'
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .verify-agent-main
          sparse-checkout: .github/actions/verify-agent/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.verify-agent-main/.github/actions/verify-agent
        id: pi
        if: steps.trusted.outcome == 'success'
        # 盖住 runner 的首轮上限（action 的 timeout-min）加追问（verify-agent.ts#FOLLOW_UP_MS），外加装 pi
        timeout-minutes: 30
        with:
          role: verifier
          pr: ${{ env.PR }}
          base: origin/${{ needs.plan.outputs.base }}
          out-dir: ${{ runner.temp }}/verify-out
          prompt: ${{ steps.prompt.outputs.prompt }}
          anthropic-federation-rule-id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic-organization-id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic-service-account-id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic-workspace-id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          github-token: ${{ github.token }}
          default-branch: ${{ github.event.repository.default_branch }}
      # 验证员能在产物目录里建符号链接，upload-artifact 会把链接指向的文件内容一起传上去
      - if: always()
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        run: |
          [ ! -L "$RUNNER_TEMP/verify-out" ] || rm "$RUNNER_TEMP/verify-out"
          find "$RUNNER_TEMP/verify-out" -type l -delete 2>/dev/null || true
      - id: ci
        if: always()
        timeout-minutes: 6
        continue-on-error: true
        run: node scripts/verify-action.ts ci --pr "$PR" --head "$HEAD" --timeout-min 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD: ${{ needs.plan.outputs.head }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.OUT }}
          path: ${{ runner.temp }}/verify-out
          if-no-files-found: ignore
          retention-days: 14

  judge:
    needs: plan
    if: needs.plan.outputs.judge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      result: ${{ steps.pi.outputs.structured_output }}
      read: ${{ steps.prompt.outputs.read }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
      - id: prompt
        run: node scripts/verify-action.ts prompt --role judge --pr "$PR"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
      - uses: ./.github/actions/verify-tools
        timeout-minutes: 8
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
      # 与 verify 同样的隔离：先清目录再从默认分支检出 verify-agent，防止 PR 代码篡改带凭据的 action
      - id: clean
        run: rm -rf .verify-agent-main
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
      - uses: actions/checkout@v5
        id: trusted
        if: steps.clean.outcome == 'success'
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .verify-agent-main
          sparse-checkout: .github/actions/verify-agent/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.verify-agent-main/.github/actions/verify-agent
        id: pi
        if: steps.trusted.outcome == 'success'
        timeout-minutes: 30
        with:
          role: judge
          pr: ${{ env.PR }}
          base: origin/${{ needs.plan.outputs.base }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          model: anthropic/claude-opus-5-5
          thinking: high
          anthropic-federation-rule-id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic-organization-id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic-service-account-id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic-workspace-id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          github-token: ${{ github.token }}
          default-branch: ${{ github.event.repository.default_branch }}

  publish:
    needs: [plan, verify, judge]
    if: ${{ !cancelled() && needs.plan.outputs.need != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 这个 job 拿 App 私钥，只跑默认分支上的脚本，PR 的代码碰不到；PR 的 head 只取来给回执展开 SHA
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - run: git fetch -q --no-tags --depth 1 origin "$HEAD"
        env:
          HEAD: ${{ needs.plan.outputs.head }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        if: needs.verify.result == 'success'
        continue-on-error: true
        with:
          name: verify-out
          path: ${{ runner.temp }}/verify-out
      # 截图推到孤立分支 verify-shots，评论里按 raw 地址嵌图；这个分支不碰任何构建监视路径
      - id: shots
        run: |
          shopt -s nullglob
          files=("$RUNNER_TEMP"/verify-out/shots/*.png)
          [ ${#files[@]} -gt 0 ] || exit 0
          dir="pr-$PR/${HEAD:0:7}-$GITHUB_RUN_ID"
          repo="$RUNNER_TEMP/shots-repo"
          git init -q "$repo"
          cd "$repo"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin verify-shots; then git checkout -q -b verify-shots FETCH_HEAD; else git checkout -q --orphan verify-shots; fi
          mkdir -p "$dir"
          for file in "${files[@]:0:12}"; do
            name=$(basename "$file" | tr -c 'A-Za-z0-9._\n-' '_')
            cp "$file" "$dir/$name"
          done
          git add "$dir"
          git commit -qm "verify shots $dir"
          pushed=
          for attempt in 1 2 3; do
            git push -q origin HEAD:verify-shots && { pushed=1; break; }
            git fetch -q --depth 1 origin verify-shots && git rebase -q FETCH_HEAD
          done
          [ -n "$pushed" ] || { echo "::warning::截图没推上 verify-shots，回执不嵌图"; exit 0; }
          echo "dir=$repo/$dir" >> "$GITHUB_OUTPUT"
          echo "url=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/verify-shots/$dir" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD: ${{ needs.plan.outputs.head }}
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: Iv23liSmKTDKh0bxIfzB
          private-key: ${{ secrets.AVATAR_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write
      - name: Publish as lyjw131[bot]
        run: >-
          node scripts/verify-action.ts publish --pr "$PR" --head "$HEAD"
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --verify-result "$VERIFY_RESULT" --judge-result "$JUDGE_RESULT"
          --shots-dir "$SHOTS_DIR" --shots-url "$SHOTS_URL"
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          HEAD: ${{ needs.plan.outputs.head }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          JUDGE_RESULT: ${{ needs.judge.result }}
          VERIFY_OUTPUT: ${{ needs.verify.outputs.result }}
          JUDGE_OUTPUT: ${{ needs.judge.outputs.result }}
          VERIFY_READ: ${{ needs.verify.outputs.read }}
          CI_OUTPUT: ${{ needs.verify.outputs.ci }}
          PROOF_OUTPUT: ${{ needs.verify.outputs.proof }}
          JUDGE_READ: ${{ needs.judge.outputs.read }}
          SHOTS_DIR: ${{ steps.shots.outputs.dir }}
          SHOTS_URL: ${{ steps.shots.outputs.url }}
