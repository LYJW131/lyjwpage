name: Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]

permissions: {}

# 只改标题或指派人的 edited（描述和目标分支都没变）、贴摘 needs-judge 以外的标签，进另一个组：组在 job 的 if 之前就生效，同组会顶掉正在跑的验证
concurrency:
  group: verify-${{ github.event.pull_request.number }}${{ ((github.event.action == 'edited' && github.event.changes.body == null && github.event.changes.base == null) || ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'needs-judge')) && '-noop' || '' }}
  cancel-in-progress: true

env:
  PR: ${{ github.event.pull_request.number }}

jobs:
  plan:
    # 只改标题不重验；改了描述（验证清单、lyjw 原话）、目标分支或 needs-judge 标签才重跑
    if: >-
      (github.event.action != 'edited' || github.event.changes.body != null || github.event.changes.base != null) &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'needs-judge')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      need: ${{ steps.plan.outputs.need }}
      judge: ${{ steps.plan.outputs.judge }}
      ui: ${{ steps.plan.outputs.ui }}
      head: ${{ steps.plan.outputs.head }}
      base: ${{ steps.plan.outputs.base }}
    steps:
      # 沿用回执要比上次回执的提交和 head：要完整历史与 origin/main
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      # 判断「只改了注释」要 TypeScript 解析器；只装这一个包，不跑整仓 pnpm install
      - name: Install TypeScript
        run: npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/ts" "typescript@$(node -p 'require("./package.json").devDependencies.typescript')"
      - id: plan
        run: node scripts/verify-action.ts plan --pr "$PR"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMENT_ONLY_REPO: ${{ runner.temp }}/ts
          EVENT_ACTION: ${{ github.event.action }}

  verify:
    needs: plan
    if: needs.plan.outputs.need != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 只读令牌：验证员能跑任意命令，回执由 publish job 发
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    outputs:
      result: ${{ steps.claude.outputs.structured_output }}
      read: ${{ steps.prompt.outputs.read }}
      # proof、ci 步骤被杀或抛错时没有输出，记成 error，回执里照样显示「没跑成」「没查到」
      proof: ${{ steps.proof.outputs.proof || (steps.proof.outcome == 'failure' && '{"verdict":"error","tests":[]}') || '' }}
      ci: ${{ steps.ci.outputs.ci || (steps.ci.outcome == 'failure' && 'error') || '' }}
    env:
      OUT: verify-out
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/verify-tools
        timeout-minutes: 14
        with:
          browsers: "true"
      # actionlint 只是验证员的一件工具，下载失败不该拖垮整个验证
      - name: Install actionlint
        continue-on-error: true
        timeout-minutes: 3
        run: |
          curl -fsSL -m 60 -o "$RUNNER_TEMP/actionlint.tgz" "https://github.com/rhysd/actionlint/releases/download/v$V/actionlint_${V}_linux_amd64.tar.gz"
          echo "$SHA  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          sudo tar xzf "$RUNNER_TEMP/actionlint.tgz" -C /usr/local/bin actionlint
        env:
          V: 1.7.12
          SHA: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      # WebKit 的系统依赖（一百多个 apt 包）只在界面档装。runner 默认的 azure 镜像时常卡住不报错（一次挂了 40 分钟）：
      # timeout 要放在 sudo 里面才杀得掉 apt-get、放开 dpkg 锁；重试前从镜像表删掉 azure，走 archive.ubuntu.com
      - name: Install browser system deps
        if: needs.plan.outputs.ui == 'true'
        timeout-minutes: 12
        run: |
          deps() { sudo timeout -k 10 300 "$(command -v playwright)" install-deps chromium webkit; }
          deps || {
            sudo dpkg --configure -a
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            deps
          }
      - id: preview
        if: needs.plan.outputs.ui == 'true'
        run: node scripts/verify-action.ts wait-preview --pr "$PR" --timeout-min 20
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # 脚本能跑的不交给模型：撤回证明在这里跑，结果写进提示词与回执。这一步跑 PR 的测试，不给令牌
      - id: proof
        timeout-minutes: 10
        continue-on-error: true
        run: node scripts/verify-action.ts proof --pr "$PR" --base "origin/$BASE" --out-dir "$RUNNER_TEMP/verify-out"
        env:
          BASE: ${{ needs.plan.outputs.base }}
      - id: prompt
        run: node scripts/verify-action.ts prompt --role verifier --pr "$PR" --preview "$PREVIEW" --out-dir "$RUNNER_TEMP/verify-out"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW: ${{ steps.preview.outputs.preview }}
      - id: claude
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
          # 验证员会跑 PR 的代码：子进程的环境去掉订阅令牌
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # 提示词是固定模板，PR 描述只作数据进来；Devin、Cursor 开的 PR 也要验
          allowed_bots: '*'
          show_full_output: true
          prompt: ${{ steps.prompt.outputs.prompt }}
          # Bash 沙箱只许写工作目录与 $TMPDIR，产物目录在 runner.temp 下，不加进来截图和 work/ 都写不进去
          claude_args: >-
            --model haiku --effort high
            --add-dir ${{ runner.temp }}/verify-out
            --allowedTools "Bash,Read,Write,Glob,Grep,WebFetch"
            --json-schema '${{ steps.prompt.outputs.schema }}'
      # A/B 对照的 A 组原始结果：回执评论只渲染了一部分
      - if: always()
        continue-on-error: true
        run: |
          rm -rf "$RUNNER_TEMP/verify-out/ab"
          mkdir "$RUNNER_TEMP/verify-out/ab"
          set -o noclobber
          printf '%s' "$RESULT" > "$RUNNER_TEMP/verify-out/ab/result.json"
          printf '%s' "$OUTCOME" > "$RUNNER_TEMP/verify-out/ab/outcome"
          [ -f "$EXECUTION" ] && cp "$EXECUTION" "$RUNNER_TEMP/verify-out/ab/execution.json" || true
        env:
          RESULT: ${{ steps.claude.outputs.structured_output }}
          OUTCOME: ${{ steps.claude.outcome }}
          EXECUTION: ${{ steps.claude.outputs.execution_file }}
      # 验证员能在产物目录里建符号链接，upload-artifact 会把链接指向的文件内容一起传上去
      - if: always()
        run: |
          [ ! -L "$RUNNER_TEMP/verify-out" ] || rm "$RUNNER_TEMP/verify-out"
          find "$RUNNER_TEMP/verify-out" -type l -delete 2>/dev/null || true
      - id: ci
        if: always()
        timeout-minutes: 6
        continue-on-error: true
        run: node scripts/verify-action.ts ci --pr "$PR" --head "$HEAD" --timeout-min 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD: ${{ needs.plan.outputs.head }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.OUT }}
          path: ${{ runner.temp }}/verify-out
          if-no-files-found: ignore
          retention-days: 14
      # 读数只下这一份小的，保留到读数的时候
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: verify-ab-cc
          path: ${{ runner.temp }}/verify-out/ab
          if-no-files-found: ignore
          retention-days: 90

  # A/B 对照的 B 组：同一份提示词交给 pi 验证员（scripts/verify-agent.ts），结果只进产物、不发回执，publish 不等它。
  # 实验任务出错只标出来：pr-gate 按 scripts/pr-gate/checks.ts#ADVISORY_CHECKS 不计它，步骤再都 continue-on-error，免得 PR 的 Checks 页红一片
  verify-pi:
    needs: plan
    if: needs.plan.outputs.need != ''
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        continue-on-error: true
        with:
          ref: ${{ needs.plan.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        continue-on-error: true
      - uses: actions/setup-node@v5
        continue-on-error: true
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        continue-on-error: true
      - uses: ./.github/actions/verify-tools
        continue-on-error: true
        timeout-minutes: 14
        with:
          browsers: "true"
      - name: Install actionlint
        continue-on-error: true
        timeout-minutes: 3
        run: |
          curl -fsSL -m 60 -o "$RUNNER_TEMP/actionlint.tgz" "https://github.com/rhysd/actionlint/releases/download/v$V/actionlint_${V}_linux_amd64.tar.gz"
          echo "$SHA  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          sudo tar xzf "$RUNNER_TEMP/actionlint.tgz" -C /usr/local/bin actionlint
        env:
          V: 1.7.12
          SHA: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      - name: Install browser system deps
        if: needs.plan.outputs.ui == 'true'
        continue-on-error: true
        timeout-minutes: 12
        run: |
          deps() { sudo timeout -k 10 300 "$(command -v playwright)" install-deps chromium webkit; }
          deps || {
            sudo dpkg --configure -a
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            deps
          }
      - id: preview
        if: needs.plan.outputs.ui == 'true'
        continue-on-error: true
        timeout-minutes: 21
        run: node scripts/verify-action.ts wait-preview --pr "$PR" --timeout-min 20
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: proof
        timeout-minutes: 10
        continue-on-error: true
        run: node scripts/verify-action.ts proof --pr "$PR" --base "origin/$BASE" --out-dir "$RUNNER_TEMP/verify-out"
        env:
          BASE: ${{ needs.plan.outputs.base }}
      - id: prompt
        continue-on-error: true
        run: node scripts/verify-action.ts prompt --role verifier --pr "$PR" --preview "$PREVIEW" --out-dir "$RUNNER_TEMP/verify-out"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW: ${{ steps.preview.outputs.preview }}
      - uses: ./.github/actions/verify-agent
        id: pi
        if: steps.prompt.outcome == 'success'
        continue-on-error: true
        # 盖住 runner 的首轮上限（action 的 timeout-min）加追问（verify-agent.ts#FOLLOW_UP_MS），外加装 pi
        timeout-minutes: 30
        with:
          role: verifier
          pr: ${{ env.PR }}
          base: origin/${{ needs.plan.outputs.base }}
          out-dir: ${{ runner.temp }}/verify-out
          prompt: ${{ steps.prompt.outputs.prompt }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ github.token }}
          default-branch: ${{ github.event.repository.default_branch }}
      - if: always()
        continue-on-error: true
        run: |
          rm -rf "$RUNNER_TEMP/verify-out/ab"
          mkdir "$RUNNER_TEMP/verify-out/ab"
          set -o noclobber
          printf '%s' "$RESULT" > "$RUNNER_TEMP/verify-out/ab/result.json"
          printf '%s' "$USAGE" > "$RUNNER_TEMP/verify-out/ab/usage.json"
          printf '%s' "${OUTCOME:-skipped}" > "$RUNNER_TEMP/verify-out/ab/outcome"
        env:
          RESULT: ${{ steps.pi.outputs.structured_output }}
          USAGE: ${{ steps.pi.outputs.usage }}
          OUTCOME: ${{ steps.pi.outcome }}
      - if: always()
        continue-on-error: true
        run: |
          [ ! -L "$RUNNER_TEMP/verify-out" ] || rm "$RUNNER_TEMP/verify-out"
          find "$RUNNER_TEMP/verify-out" -type l -delete 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: verify-out-pi
          path: ${{ runner.temp }}/verify-out
          if-no-files-found: ignore
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: verify-ab-pi
          path: ${{ runner.temp }}/verify-out/ab
          if-no-files-found: ignore
          retention-days: 90

  judge:
    needs: plan
    if: needs.plan.outputs.judge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    outputs:
      result: ${{ steps.claude.outputs.structured_output }}
      read: ${{ steps.prompt.outputs.read }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: prompt
        run: node scripts/verify-action.ts prompt --role judge --pr "$PR"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: ./.github/actions/verify-tools
        timeout-minutes: 8
      - id: claude
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
          # 验证员会跑 PR 的代码：子进程的环境去掉订阅令牌
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # 提示词是固定模板，PR 描述只作数据进来；Devin、Cursor 开的 PR 也要验
          allowed_bots: '*'
          show_full_output: true
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_args: >-
            --model opus --effort high
            --allowedTools "Bash,Read,Glob,Grep"
            --json-schema '${{ steps.prompt.outputs.schema }}'

  publish:
    needs: [plan, verify, judge]
    if: ${{ !cancelled() && needs.plan.outputs.need != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 这个 job 拿 App 私钥，只跑默认分支上的脚本，PR 的代码碰不到；PR 的 head 只取来给回执展开 SHA
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - run: git fetch -q --no-tags --depth 1 origin "$HEAD"
        env:
          HEAD: ${{ needs.plan.outputs.head }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        if: needs.verify.result == 'success'
        continue-on-error: true
        with:
          name: verify-out
          path: ${{ runner.temp }}/verify-out
      # 截图推到孤立分支 verify-shots，评论里按 raw 地址嵌图；这个分支不碰任何构建监视路径
      - id: shots
        run: |
          shopt -s nullglob
          files=("$RUNNER_TEMP"/verify-out/shots/*.png)
          [ ${#files[@]} -gt 0 ] || exit 0
          dir="pr-$PR/${HEAD:0:7}-$GITHUB_RUN_ID"
          repo="$RUNNER_TEMP/shots-repo"
          git init -q "$repo"
          cd "$repo"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin verify-shots; then git checkout -q -b verify-shots FETCH_HEAD; else git checkout -q --orphan verify-shots; fi
          mkdir -p "$dir"
          for file in "${files[@]:0:12}"; do
            name=$(basename "$file" | tr -c 'A-Za-z0-9._\n-' '_')
            cp "$file" "$dir/$name"
          done
          git add "$dir"
          git commit -qm "verify shots $dir"
          pushed=
          for attempt in 1 2 3; do
            git push -q origin HEAD:verify-shots && { pushed=1; break; }
            git fetch -q --depth 1 origin verify-shots && git rebase -q FETCH_HEAD
          done
          [ -n "$pushed" ] || { echo "::warning::截图没推上 verify-shots，回执不嵌图"; exit 0; }
          echo "dir=$repo/$dir" >> "$GITHUB_OUTPUT"
          echo "url=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/verify-shots/$dir" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD: ${{ needs.plan.outputs.head }}
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: Iv23liSmKTDKh0bxIfzB
          private-key: ${{ secrets.AVATAR_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write
      - name: Publish as lyjw131[bot]
        run: >-
          node scripts/verify-action.ts publish --pr "$PR" --head "$HEAD"
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --verify-result "$VERIFY_RESULT" --judge-result "$JUDGE_RESULT"
          --shots-dir "$SHOTS_DIR" --shots-url "$SHOTS_URL"
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          HEAD: ${{ needs.plan.outputs.head }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          JUDGE_RESULT: ${{ needs.judge.result }}
          VERIFY_OUTPUT: ${{ needs.verify.outputs.result }}
          JUDGE_OUTPUT: ${{ needs.judge.outputs.result }}
          VERIFY_READ: ${{ needs.verify.outputs.read }}
          CI_OUTPUT: ${{ needs.verify.outputs.ci }}
          PROOF_OUTPUT: ${{ needs.verify.outputs.proof }}
          JUDGE_READ: ${{ needs.judge.outputs.read }}
          SHOTS_DIR: ${{ steps.shots.outputs.dir }}
          SHOTS_URL: ${{ steps.shots.outputs.url }}
