name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Pages 只留一个转址页，让已经发出去的 lyjw131.github.io/lyjwpage 链接落到 README 的架构图。
      - name: Prepare redirect page
        env:
          TARGET: https://github.com/LYJW131/lyjwpage#%E7%B3%BB%E7%BB%9F%E6%9E%B6%E6%9E%84
        run: |
          mkdir -p _site
          printf '<!doctype html><meta charset="utf-8"><title>lyjwpage</title><meta http-equiv="refresh" content="0; url=%s"><link rel="canonical" href="%s"><a href="%s">lyjwpage</a>\n' "$TARGET" "$TARGET" "$TARGET" > _site/index.html
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
