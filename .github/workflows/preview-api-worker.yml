# PR 关闭后删掉该分支的影子 api Worker。没配 CLOUDFLARE_API_TOKEN 就跳过。
name: Delete preview API worker

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Check cleanup token
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "未配置 CLOUDFLARE_API_TOKEN，留下影子 Worker"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.token.outputs.skip == '0'

      - uses: pnpm/action-setup@v6
        if: steps.token.outputs.skip == '0'

      - uses: actions/setup-node@v5
        if: steps.token.outputs.skip == '0'
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.token.outputs.skip == '0'

      - name: Delete the branch preview worker
        if: steps.token.outputs.skip == '0'
        env:
          PREVIEW_BRANCH: ${{ github.head_ref }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "209f2c881b1c494fec50851c067b3266"
        run: node workers/api/scripts/delete-preview.mjs
