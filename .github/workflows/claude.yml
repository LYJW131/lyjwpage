name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # 先按 main 的锁文件装好；PR 分支的锁文件不同时，Claude 自己会再装一次。
      - run: pnpm install --frozen-lockfile

      # 带 CLAUDE_CODE_ENTRYPOINT=claude-code-github-action 或 CLAUDE_CODE_ACTION 的请求，API 误报 400「Credit balance is too low」，
      # 同一凭据去掉这两个变量就正常扣 API 余额（anthropics/claude-code-action#1901）。写在工作流里而不是本地 action：verify 检出的是 PR head，旧分支没有那个目录
      - id: unmarked
        if: vars.CLAUDE_AUTH != 'oauth' && vars.ANTHROPIC_FEDERATION_RULE_ID != ''
        run: |
          timeout 180 bash -o pipefail -c 'curl -fsSL https://claude.ai/install.sh | bash' > /dev/null
          test -x "$HOME/.local/bin/claude"
          printf '#!/bin/sh\nunset CLAUDE_CODE_ENTRYPOINT CLAUDE_CODE_ACTION\nexec "%s" "$@"\n' "$HOME/.local/bin/claude" > "$RUNNER_TEMP/claude-unmarked"
          chmod +x "$RUNNER_TEMP/claude-unmarked"
          echo "path=$RUNNER_TEMP/claude-unmarked" >> "$GITHUB_OUTPUT"
      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # 计费：仓库变量 ANTHROPIC_FEDERATION_RULE_ID 有值就用 GitHub OIDC 联合认证走 API 按量计费（WIF，无静态 key）；变量 CLAUDE_AUTH=oauth 或没配 WIF 时走订阅的 setup token
          claude_code_oauth_token: ${{ (vars.CLAUDE_AUTH == 'oauth' || vars.ANTHROPIC_FEDERATION_RULE_ID == '') && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          anthropic_federation_rule_id: ${{ vars.CLAUDE_AUTH != 'oauth' && vars.ANTHROPIC_FEDERATION_RULE_ID || '' }}
          anthropic_organization_id: ${{ vars.CLAUDE_AUTH != 'oauth' && vars.ANTHROPIC_ORGANIZATION_ID || '' }}
          anthropic_service_account_id: ${{ vars.CLAUDE_AUTH != 'oauth' && vars.ANTHROPIC_SERVICE_ACCOUNT_ID || '' }}
          anthropic_workspace_id: ${{ vars.CLAUDE_AUTH != 'oauth' && vars.ANTHROPIC_WORKSPACE_ID || '' }}
          path_to_claude_code_executable: ${{ steps.unmarked.outputs.path }}

          additional_permissions: |
            actions: read

          # 有意放开：任意 Bash（装依赖、跑检查）、读写文件、查外部文档。
          # 只有对仓库有写权限的人 @claude 才会触发（Action 自带检查），跑的是 PR 分支上的代码。
          claude_args: |
            --allowedTools "Bash,Read,Write,Edit,MultiEdit,Glob,Grep,WebSearch,WebFetch"
