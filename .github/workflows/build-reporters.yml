# 容器上报器的镜像在这里构建，推到 GHCR；机器上只 `docker compose pull`，不再现场 build。
# 从前是把源码 tar 到机器上就地 build：agents-reporter 装五个 CLI，
# misaka-jp 那台 1C2G 冷 build 约 10 分钟。
#
# 只构建改了的那几个：一个目录（或这个文件）有变化才进 matrix。
# PR 只 build 不推，验证 Dockerfile 还能跑通；合进 main 才推 `latest` 和 `sha-<短哈希>`。
# 手动触发（workflow_dispatch）三个全推，用来刷新基础镜像或 CLI 版本。
#
# misaka-jp 上的两个（server-reporter、agents-reporter）推完镜像接着自动换：
# deploy 这一步用一把只能跑 /opt/lyjwpage/deploy.sh 的密钥 ssh 过去，脚本点名
# pull、重建那一个、清悬空镜像（见 reporters/misaka-deploy.sh）。密钥、主机指纹和
# 地址在 `misaka-jp` 这个 environment 里，只有 main 能用。
# emby-reporter 在内网的 dsm 上，Actions 够不着，仍按它的 README 手动拉。
name: Build reporters

on:
  push:
    branches: [main]
    paths:
      - reporters/agents-reporter/**
      - reporters/server-reporter/**
      - reporters/emby-reporter/**
      - .github/workflows/build-reporters.yml
  pull_request:
    paths:
      - reporters/agents-reporter/**
      - reporters/server-reporter/**
      - reporters/emby-reporter/**
      - .github/workflows/build-reporters.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      images: ${{ steps.pick.outputs.images }}
      misaka: ${{ steps.pick.outputs.misaka }}
    steps:
      - uses: actions/checkout@v5

      # 改了 workflow 本身三个都重跑一遍，确认改动对每个镜像都成立
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            agents-reporter:
              - reporters/agents-reporter/**
              - .github/workflows/build-reporters.yml
            server-reporter:
              - reporters/server-reporter/**
              - .github/workflows/build-reporters.yml
            emby-reporter:
              - reporters/emby-reporter/**
              - .github/workflows/build-reporters.yml

      - id: pick
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            CHANGED='["agents-reporter","server-reporter","emby-reporter"]'
          fi
          echo "images=${CHANGED:-[]}" >> "$GITHUB_OUTPUT"
          # 其中跑在 misaka-jp 上、推完要自动换的那几个
          echo "misaka=$(echo "${CHANGED:-[]}" | jq -c '[.[] | select(. == "server-reporter" or . == "agents-reporter")]')" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    # 同一镜像同一分支连推几次，只留最后一次
    concurrency:
      group: build-${{ matrix.image }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 仓库名里的大写由它转小写：ghcr.io/lyjw131/<镜像>
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=pr

      # 只出 amd64：misaka-jp 和 dsm 都是 x86_64，没有 arm64 的消费者。
      # 缓存用 mode=min：agents-reporter 那层有几个 GB，mode=max 会很快挤满仓库的 Actions 缓存额度。
      - uses: docker/build-push-action@v7
        with:
          context: reporters/${{ matrix.image }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 没声明这个 ARG 的镜像会忽略它；server-reporter 拿它报自己是哪一版
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=min

  deploy:
    needs: [changes, build]
    # 只有合进 main（或在 main 上手动触发）推了 latest 才换；PR 只 build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.changes.outputs.misaka != '[]'
    runs-on: ubuntu-latest
    environment: misaka-jp
    permissions:
      contents: read
    # 同一台机器、同一个 compose project：一个一个来，也不和下一次推送的部署抢
    concurrency:
      group: deploy-misaka-jp
      cancel-in-progress: false
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.misaka) }}
    steps:
      - name: Prepare SSH
        env:
          DEPLOY_KEY: ${{ secrets.MISAKA_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.MISAKA_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # 服务名是 ssh 发过去的「命令」，机器那头的 command= 只把它当 SSH_ORIGINAL_COMMAND 读
      - name: Pull and restart ${{ matrix.service }}
        env:
          HOST: ${{ secrets.MISAKA_HOST }}
        run: |
          set -o pipefail
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            "root@$HOST" "${{ matrix.service }}" | tee deploy.log

      - name: Verify
        env:
          SERVICE: ${{ matrix.service }}
          SHA: ${{ github.sha }}
        run: |
          grep -q '^status=running restarts=0 ' deploy.log || { echo "::error::$SERVICE is not running cleanly"; exit 1; }
          # 只有 server-reporter 的镜像里烧了提交；对上了才算换到这一版
          if [ "$SERVICE" = server-reporter ]; then
            grep -qx "REPORTER_COMMIT=$SHA" deploy.log || { echo "::error::$SERVICE is not running $SHA"; exit 1; }
          fi
