name: Build reporters

on:
  push:
    branches: [main]
    paths:
      - reporters/agents-reporter/**
      - reporters/server-reporter/**
      - reporters/emby-reporter/**
      - reporters/playstation-reporter/**
      - reporters/discord-reporter/**
      - .github/workflows/build-reporters.yml
  pull_request:
    paths:
      - reporters/agents-reporter/**
      - reporters/server-reporter/**
      - reporters/emby-reporter/**
      - reporters/playstation-reporter/**
      - reporters/discord-reporter/**
      - .github/workflows/build-reporters.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      images: ${{ steps.pick.outputs.images }}
      misaka: ${{ steps.pick.outputs.misaka }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            agents-reporter:
              - reporters/agents-reporter/**
              - .github/workflows/build-reporters.yml
            server-reporter:
              - reporters/server-reporter/**
              - .github/workflows/build-reporters.yml
            emby-reporter:
              - reporters/emby-reporter/**
              - .github/workflows/build-reporters.yml
            discord-reporter:
              - reporters/discord-reporter/**
              - .github/workflows/build-reporters.yml
            playstation-reporter:
              - reporters/playstation-reporter/**
              - .github/workflows/build-reporters.yml

      - id: pick
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            CHANGED='["agents-reporter","server-reporter","emby-reporter","playstation-reporter","discord-reporter"]'
          fi
          echo "images=${CHANGED:-[]}" >> "$GITHUB_OUTPUT"
          echo "misaka=$(echo "${CHANGED:-[]}" | jq -c '[.[] | select(. == "server-reporter" or . == "agents-reporter" or . == "discord-reporter")]')" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    concurrency:
      group: build-${{ matrix.image }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=pr

      # mode=max 会把 CLI 的大体积中间层写进 Actions 缓存并挤满额度，必须用 mode=min。
      - uses: docker/build-push-action@v7
        with:
          context: reporters/${{ matrix.image }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=min

  deploy:
    needs: [changes, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.changes.outputs.misaka != '[]'
    runs-on: ubuntu-latest
    environment: misaka-jp
    permissions:
      contents: read
    concurrency:
      group: deploy-misaka-jp
      cancel-in-progress: false
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.misaka) }}
    steps:
      - name: Prepare SSH
        env:
          DEPLOY_KEY: ${{ secrets.MISAKA_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.MISAKA_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # 服务名由远端 SSH 强制命令按白名单读取，不能改成任意远程 shell 命令。
      - name: Pull and restart ${{ matrix.service }}
        env:
          HOST: ${{ secrets.MISAKA_HOST }}
        run: |
          set -o pipefail
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            "root@$HOST" "${{ matrix.service }}" | tee deploy.log

      - name: Verify
        env:
          SERVICE: ${{ matrix.service }}
          SHA: ${{ github.sha }}
        run: |
          grep -q '^status=running restarts=0 ' deploy.log || { echo "::error::$SERVICE is not running cleanly"; exit 1; }
          if [ "$SERVICE" = server-reporter ]; then
            grep -qx "REPORTER_COMMIT=$SHA" deploy.log || { echo "::error::$SERVICE is not running $SHA"; exit 1; }
          fi
