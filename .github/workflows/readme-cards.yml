name: README Cards

# 量 README 里每张 /cards/<卡>.svg 的写死卡高和内容实高，底部留白或被裁就红。
# 生产部署后量一次：卡高写在路由里，卡片组件或样式改了行高、行数，路由不跟着改就会对不上
on:
  workflow_run:
    workflows: ["Purge ESA and Notify Pages on Deploy"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: readme-cards
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      # 只要 Playwright 的 API：浏览器用 runner 自带的 Google Chrome（site-verify 先试 channel chrome）
      - run: npm install -g --no-audit --no-fund playwright@1.63.0
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: node scripts/site-verify.ts readme-cards --url https://lyjw.me
