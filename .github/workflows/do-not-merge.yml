name: Do Not Merge

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions: {}

concurrency:
  group: do-not-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # 一次性测试 PR 开的时候就贴 do-not-merge 标签；带着它这一项就红，pr-gate 不 ready，合并钩子（scripts/guard-merge-method.ts）拦下。
  # 不设成分支保护的必需检查：avatar-sync.yml 开完 PR 当场就合，等不到这一项
  do-not-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Block merge
        if: contains(github.event.pull_request.labels.*.name, 'do-not-merge')
        run: |
          echo "::error::这是不合并的测试 PR（带 do-not-merge 标签）。要合先摘掉标签。"
          exit 1
