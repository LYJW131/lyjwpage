name: Claude Code Review

on:
  pull_request:
    # code-review 插件见到 PR 上已有 Claude 评论就退出，后续推送触发只会空跑；贴 needs-judge 也触发一次，线程常在开 PR 之后才贴
    types: [opened, ready_for_review, labeled]

jobs:
  claude-review:
    if: github.event.action != 'labeled' || github.event.label.name == 'needs-judge'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      # 插件扫得深（多文件改动派约 8 个子代理），只审要判定的 PR（贴了 needs-judge 标签或作者不是 lyjw 的账号）
      - name: Tier
        id: tier
        run: node scripts/pr-tier.ts --pr "$PR"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}

      - name: Run Claude Code Review
        if: steps.tier.outputs.judge == 'true'
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          # 插件把子代理派到后台，Action 收到第一个 result 就退出，审查会显示成功却什么都不发
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          # 计费开关同 verify.yml
          claude_code_oauth_token: ${{ vars.CLAUDE_AUTH != 'api' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          anthropic_api_key: ${{ vars.CLAUDE_AUTH == 'api' && secrets.ANTHROPIC_API_KEY || '' }}
          allowed_bots: 'cursor,lyjw131'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # 默认隐藏模型过程，看不出审查有没有真派子代理、读 diff
          show_full_output: true
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # 只放行发评论工具时，插件读 PR 与派子代理的调用被拒，审查会不读 diff 就回 No issues found。
          # 默认的 Sonnet 5.5 当编排者时不照插件派子代理，一个人读一两个文件就发 No issues found（anthropics/claude-code#100401）。
          claude_args: '--model opus --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Read,Glob,Grep,Task,Agent"'

