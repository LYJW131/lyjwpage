name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  # main 按提交分组：同组只留一个排队运行，按 ref 分组时连推三次会顶掉中间那个；main 上每个提交都要有结论，红了才查得到是哪个提交引入的。
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate workspace
        run: bash scripts/ci-checks.sh
        env:
          # 只认 lyjw 打标签触发的那一次运行：之后再推送，标签还挂着也不放行，要 lyjw 摘了重打。
          BASELINE_EXCEPTION: ${{ github.event.action == 'labeled' && github.event.label.name == 'baseline-exception' && github.actor == 'LYJW131' }}
