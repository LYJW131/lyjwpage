name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - .github/github-avatar.sha256
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    # 仓库变量 SELF_HOSTED_RUNNER=on 时走自建 runner；只放行本仓库分支；fork 来的 PR 和访客构建的 PR（claude/build-*，见 shared/build-routine.ts#branchForRun）含外人能左右的代码，留在托管机。机器离线时把变量关掉，任务会一直排队等它
    runs-on: ${{ vars.SELF_HOSTED_RUNNER == 'on' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'claude/build-') && github.event.pull_request.user.login != 'lyjw131[bot]')) && fromJSON('["self-hosted","linux","x64","lyjwpage"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # 自建机的 pnpm store 常驻在本机，不必再从 Actions 缓存下载
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}

      - run: pnpm install --frozen-lockfile

      # CI_CACHE_DIR 只在自建机上设置。按内容判定缓存是因为每次检出文件 mtime 都会变；先复制再改名回去，并发任务不会写坏同一份缓存
      - name: pnpm lint
        run: |
          if [ -z "${CI_CACHE_DIR:-}" ]; then
            pnpm lint
            exit 0
          fi
          cp "$CI_CACHE_DIR/eslintcache" "$RUNNER_TEMP/eslintcache" 2>/dev/null || true
          pnpm lint --cache --cache-strategy content --cache-location "$RUNNER_TEMP/eslintcache"
          cp "$RUNNER_TEMP/eslintcache" "$CI_CACHE_DIR/eslintcache.$GITHUB_JOB.$GITHUB_RUN_ID"
          mv "$CI_CACHE_DIR/eslintcache.$GITHUB_JOB.$GITHUB_RUN_ID" "$CI_CACHE_DIR/eslintcache"

      - run: pnpm -r --include-workspace-root typecheck

      - run: pnpm test

      - run: pnpm --filter @lyjwpage/api test

      - run: pnpm --filter @lyjwpage/ai test

      - run: pnpm --filter @lyjwpage/ingress test

      - run: pnpm --filter @lyjwpage/collector test

      - run: pnpm --filter @lyjwpage/agents-reporter --filter @lyjwpage/server-reporter --filter @lyjwpage/emby-reporter --filter @lyjwpage/playstation-reporter --filter @lyjwpage/discord-reporter test

      - run: node --test scripts/*.test.mjs

      - run: pnpm docs:check
