name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # main 上每个提交都要有完整结论，main 红了才查得到是哪个提交引入的；PR 上的旧运行照常被新推送取消。
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate workspace
        run: bash scripts/ci-checks.sh
        env:
          # 只认 lyjw 打标签触发的那一次运行：之后再推送，标签还挂着也不放行，要 lyjw 摘了重打。
          BASELINE_EXCEPTION: ${{ github.event.action == 'labeled' && github.event.label.name == 'baseline-exception' && github.actor == 'LYJW131' }}
