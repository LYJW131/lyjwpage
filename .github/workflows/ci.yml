name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - .github/github-avatar.sha256
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # 仓库变量 SELF_HOSTED_RUNNER=on 时走自建 runner，条件与 codeql.yml 一致；只放行本仓库分支；fork 来的 PR 和访客构建的 PR（claude/build-*，见 shared/build-routine.ts#branchForRun）含外人能左右的代码，留在托管机。机器离线时把变量关掉，任务会一直排队等它
    runs-on: ${{ vars.SELF_HOSTED_RUNNER == 'on' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'claude/build-') && github.event.pull_request.user.login != 'lyjw131[bot]')) && fromJSON('["self-hosted","linux","x64","lyjwpage"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        if: runner.environment == 'github-hosted'

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # 自建机的 pnpm store 常驻在本机，不必再从 Actions 缓存下载
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          package-manager-cache: ${{ runner.environment == 'github-hosted' }}

      - name: Reuse pnpm tool
        if: runner.environment == 'self-hosted'
        run: bash scripts/setup-ci-pnpm.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile ${CI_CACHE_DIR:+--store-dir "$CI_CACHE_DIR/pnpm-store"}

      - name: Validate workspace
        run: bash scripts/ci-checks.sh
