name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm -r --include-workspace-root typecheck

      - run: pnpm test

      - run: pnpm --filter @lyjwpage/api test

      - run: pnpm --filter @lyjwpage/ingress test

      - run: pnpm --filter @lyjwpage/collector test

      - run: pnpm --filter @lyjwpage/agents-reporter --filter @lyjwpage/server-reporter --filter @lyjwpage/emby-reporter --filter @lyjwpage/playstation-reporter --filter @lyjwpage/discord-reporter test

      - run: node --test scripts/*.test.mjs

      - run: pnpm docs:check
