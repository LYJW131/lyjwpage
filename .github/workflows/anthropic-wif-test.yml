name: anthropic-wif-test
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  call-claude:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);
      - name: Exchange for an Anthropic access token
        run: |
          curl -sS https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data @- <<JSON | jq 'with_entries(if (.key | test("token$")) then .value = "<redacted>" else . end)'
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "fdrl_012epwhUyPaCQHHAtzx535yA",
            "organization_id": "5ac99a46-8fcf-4cb2-99b8-83382c7ce79b",
            "service_account_id": "svac_01URxacmVs5jj36HUpnnAZN2",
            "workspace_id": "wrkspc_01EKGUJQbX9gKyF1ohp8WmUo"
          }
          JSON
