name: Cursor Agent

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

# 同一 PR 的指令排队执行，避免两个 agent 同时往一条分支推送。
concurrency:
  group: cursor-agent-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  run:
    # 触发词不用 @cursor：仓库装了 Cursor GitHub App，它会自己响应 @cursor 并另起一个 agent。
    if: >
      ((github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
       github.event_name == 'pull_request_review_comment') &&
      startsWith(github.event.comment.body, '/cursor') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # 固定取默认分支的脚本：review comment 事件默认检出 PR 代码，不能让它在持有密钥的任务里执行。
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Run Cursor cloud agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_MODEL: ${{ vars.CURSOR_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/run-cursor-agent.mjs
