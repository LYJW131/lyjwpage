name: Purge ESA and Notify Pages on Deploy

on:
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      commit:
        description: Production commit SHA; empty uses main
        required: false
        type: string

permissions:
  contents: read

jobs:
  deployment:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.check_run.app.slug == 'cloudflare-workers-and-pages' &&
       github.event.check_run.name == 'Workers Builds: site' &&
       github.event.check_run.conclusion == 'success' &&
       github.event.check_run.check_suite.head_branch == 'main')
    # 组挂在 job 上：顶层组在 if 求值前就入组，无关的 check_run 会顶掉排队中的真部署；if 不成立的 job 不入组。
    # 组按部署 sha 分：各部署共用一个 pending 位时，乱序完成的旧部署或手动重跑也会顶掉新部署；不同部署并行，旧的由 wait-site-version 让位。
    concurrency:
      group: esa-purge-${{ github.event.check_run.head_sha || inputs.commit || github.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      live: ${{ steps.source.outputs.live }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate production deployment
        id: commit
        run: node scripts/site-deploy-event.mjs >> "$GITHUB_OUTPUT"
      - name: Wait for the source domain
        id: source
        if: steps.commit.outputs.eligible == 'true'
        env:
          EXPECTED_SHA: ${{ steps.commit.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-site-version.mjs https://lyjw.me

  purge:
    needs: deployment
    if: needs.deployment.outputs.live == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Purge ESA Homepage Cache
        env:
          ESA_SITE_ID: "1113300533463584"
          ESA_CACHE_URL: "https://lyjw131.com/"
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        run: node scripts/run-esa-purge.mjs

  # 必须先刷 ESA 再通知页面，并等待域名切换到新版本，否则刷新仍会拿到旧 HTML。
  notify:
    needs: [deployment, purge]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Wait for production domains to serve the new build
        id: domains
        env:
          EXPECTED_SHA: ${{ needs.deployment.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-site-version.mjs https://lyjw.me https://lyjw131.com

      # 各 Worker 并行上线；接收端尚未换版时会短暂返回 404/405，需重试。
      - name: Notify open pages
        if: steps.domains.outputs.live == 'true'
        env:
          ACCESS_CLIENT_ID: ${{ secrets.ACCESS_CLIENT_ID }}
          ACCESS_CLIENT_SECRET: ${{ secrets.ACCESS_CLIENT_SECRET }}
        run: |
          [ -n "$ACCESS_CLIENT_ID" ] && [ -n "$ACCESS_CLIENT_SECRET" ] || { echo "::error::Access service token is not configured"; exit 1; }
          curl -fsS --max-time 15 --retry 30 --retry-all-errors --retry-delay 20 --retry-max-time 600 -X POST \
            -H "CF-Access-Client-Id: $ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $ACCESS_CLIENT_SECRET" \
            https://ingest.homepage.lyjw.llc/api/internal/site-deployed
