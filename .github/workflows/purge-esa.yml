name: Purge ESA and Notify Pages on Deploy

on:
  deployment_status:
  workflow_dispatch:

concurrency:
  group: esa-purge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  purge:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       (github.event.deployment.environment == 'Production' || github.event.deployment.original_environment == 'Production'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Purge ESA Homepage Cache
        env:
          ESA_SITE_ID: "1113300533463584"
          ESA_CACHE_URL: "https://lyjw131.com/"
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        run: node scripts/run-esa-purge.mjs

  # 必须先刷 ESA 再通知页面，并等待域名切换到新版本，否则刷新仍会拿到旧 HTML。
  notify:
    needs: purge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for production domains to serve the new build
        env:
          EXPECTED_SHA: ${{ github.event.deployment.sha }}
        run: |
          [ -n "$EXPECTED_SHA" ] || { echo "没有部署 sha，跳过等待"; exit 0; }
          for origin in https://lyjw.me https://lyjw131.com; do
            for attempt in $(seq 1 30); do
              commit=$(curl -fsS --max-time 10 -H 'Cache-Control: no-cache' "$origin/api/version" | jq -r '.commit // empty' || true)
              if [ "$commit" = "$EXPECTED_SHA" ]; then echo "$origin 已是 $commit"; continue 2; fi
              echo "$origin 仍是 ${commit:-未知}，第 $attempt 次，10 秒后重试"
              sleep 10
            done
            echo "::warning::$origin 5 分钟内没有答出 $EXPECTED_SHA"
          done

      # Vercel 与 Workers Builds 并行上线；接收端尚未换版时会短暂返回 404/405，需重试。
      - name: Notify open pages
        env:
          ACCESS_CLIENT_ID: ${{ secrets.ACCESS_CLIENT_ID }}
          ACCESS_CLIENT_SECRET: ${{ secrets.ACCESS_CLIENT_SECRET }}
        run: |
          [ -n "$ACCESS_CLIENT_ID" ] && [ -n "$ACCESS_CLIENT_SECRET" ] || { echo "::error::仓库没配 ACCESS_CLIENT_ID / ACCESS_CLIENT_SECRET"; exit 1; }
          curl -fsS --max-time 15 --retry 30 --retry-all-errors --retry-delay 20 --retry-max-time 600 -X POST \
            -H "CF-Access-Client-Id: $ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $ACCESS_CLIENT_SECRET" \
            https://ingest.homepage.lyjw.llc/api/internal/site-deployed
