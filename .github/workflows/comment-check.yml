name: Comment Check

# 只给写代码的线程一份建议：Check run 有该删的注释时是 neutral，不挡合并，pr-gate 把它列进 notes
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**.ts"
      - "**.tsx"
      - "**.mts"
      - "**.cts"
      - "**.js"
      - "**.jsx"
      - "**.mjs"
      - "**.cjs"

permissions: {}

concurrency:
  group: comment-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  jev:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      # 默认检出 PR 的合并提交：第一个父提交就是此刻的 base，两者相比正好是 PR 带来的改动
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/comment-check.ts --base HEAD^1 --head HEAD --out "$RUNNER_TEMP/comment-check.json" --check-run "$HEAD_SHA"
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comment-check
          path: ${{ runner.temp }}/comment-check.json
          if-no-files-found: ignore
          retention-days: 14
