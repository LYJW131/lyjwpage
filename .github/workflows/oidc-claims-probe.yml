name: OIDC claims probe
on:
  push:
    branches: [claude/oidc-claims-probe]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=probe" | jq -r .value)
          echo "::add-mask::$token"
          echo "$token" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{workflow_ref, job_workflow_ref, event_name, ref, runner_environment, repository_id, repository_owner_id}' || true
