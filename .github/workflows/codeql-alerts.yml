# 云端会话读 code-scanning 告警接口一律 403：main 上的 CodeQL 跑完后，lyjw131[bot] 把未关闭的告警写进一个带 Automation 标签的常驻 issue
# （和 #185、#280 一样），每日代码审查读它、在下面评论处置
name: CodeQL Alerts

on:
  workflow_run:
    workflows: [CodeQL]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: read

concurrency:
  group: codeql-alerts
  cancel-in-progress: false

env:
  MARKER: "<!-- codeql-alerts -->"

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 显式 bash 才带 pipefail：接口报错时任务要红，不能读成一份空数组把清单刷成「没有告警」
      - name: Read open alerts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate "repos/$GITHUB_REPOSITORY/code-scanning/alerts?state=open&per_page=100" --jq '.[]' | jq -s . > "$RUNNER_TEMP/alerts.json"

      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: Iv23liSmKTDKh0bxIfzB
          private-key: ${{ secrets.AVATAR_APP_PRIVATE_KEY }}
          permission-issues: write

      - name: Update the alert issue as lyjw131[bot]
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          alerts="$RUNNER_TEMP/alerts.json"
          count=$(jq length "$alerts")
          {
            printf '%s\n\n' "$MARKER"
            printf 'main 上 CodeQL 未关闭的告警共 %s 条（%s 更新）。每日代码审查每轮读这份清单，在下面评论处置，修复走它自己的审查 PR。\n' "$count" "$(TZ=Asia/Singapore date "+%F %R (SGT)")"
            if [ "$count" -gt 0 ]; then
              printf '\n| # | 规则 | 级别 | 位置 | 说明 |\n| --- | --- | --- | --- | --- |\n'
              jq -r '.[] | "| [#\(.number)](\(.html_url)) | `\(.rule.id)` | \(.rule.security_severity_level // .rule.severity) | `\(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line)` | \(.most_recent_instance.message.text | gsub("[\r\n]+"; " ") | gsub("\\|"; "\\|")) |"' "$alerts"
            fi
          } > "$RUNNER_TEMP/body.md"
          number=$(gh api "repos/$GITHUB_REPOSITORY/issues?labels=Automation&state=open&per_page=100" --jq "[.[] | select(.pull_request == null and ((.body // \"\") | startswith(\"$MARKER\")))][0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label Automation --title "CodeQL 告警清单" --body-file "$RUNNER_TEMP/body.md"
          fi
