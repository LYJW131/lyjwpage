name: PR Co-Authors

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-coauthors-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  coauthors:
    # 合并提交的正文取 PR 描述，描述末段的 Co-Authored-By 才让站点的提交列表显示参与的 agent 与模型。
    # 用 GITHUB_TOKEN 改描述不会再触发 edited，不会自循环；fork 来的 PR 拿不到写权限，跳过。
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Sync co-author trailers into the PR description
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/pr-coauthors.mjs ${{ github.event.pull_request.number }}
