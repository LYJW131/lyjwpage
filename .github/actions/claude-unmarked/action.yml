name: Claude Code without action markers
description: 装 Claude Code，再包一层启动脚本，启动前去掉 claude-code-action 加的来源标记

outputs:
  path:
    description: 给 claude-code-action 的 path_to_claude_code_executable
    value: ${{ steps.wrap.outputs.path }}

runs:
  using: composite
  steps:
    # 带 CLAUDE_CODE_ENTRYPOINT=claude-code-github-action 或 CLAUDE_CODE_ACTION 的请求，API 误报 400「Credit balance is too low」，
    # 同一凭据去掉这两个变量就正常扣 API 余额（anthropics/claude-code-action#1901、#1888）。官方修好后删掉这个 action 与各工作流里的引用
    - id: wrap
      shell: bash
      run: |
        timeout 180 bash -c 'curl -fsSL https://claude.ai/install.sh | bash' > /dev/null
        wrapper="$RUNNER_TEMP/claude-unmarked"
        printf '#!/bin/sh\nunset CLAUDE_CODE_ENTRYPOINT CLAUDE_CODE_ACTION\nexec "%s" "$@"\n' "$HOME/.local/bin/claude" > "$wrapper"
        chmod +x "$wrapper"
        echo "path=$wrapper" >> "$GITHUB_OUTPUT"
