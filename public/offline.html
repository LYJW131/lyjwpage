<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Reconnect to see the latest device, music, and activity status.">
  <meta name="robots" content="noindex, nofollow">
  <title>Offline — LYJW's Homepage</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; background: #fff; color: #171717; }
    body { min-height: 100svh; margin: 0; display: grid; place-items: center; }
    main { padding: 32px; max-width: 360px; }
    .brand { font-family: monospace; letter-spacing: .15em; color: #737373; }
    h1 { font-size: 28px; margin: 28px 0 12px; }
    p { line-height: 1.7; color: #737373; }
    a { display: inline-block; margin-top: 16px; padding: 12px 22px; border-radius: 12px; background: #171717; color: #fff; text-decoration: none; font-weight: 600; }
    a:focus-visible { outline: 3px solid #0891b2; outline-offset: 4px; }
    @media (prefers-color-scheme: dark) { :root { background: #0a0a0a; color: #fafafa; } p,.brand { color: #a3a3a3; } a { background: #fafafa; color: #171717; } }
  </style>
</head>
<body>
  <main>
    <div class="brand">LYJW</div>
    <h1>You're offline</h1>
    <p>Reconnect to see the latest device, music, and activity status.</p>
    <a href="/">Reconnect</a>
  </main>
</body>
</html>
