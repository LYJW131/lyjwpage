<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<script>
  // 站点上的地址是 /explainer（没有结尾斜杠，由 next.config 的 rewrite 指到构建出的这份页面），相对路径会按根目录算；
  // 补一个 base，让脚本、字体、配乐都从 /explainer/ 下取。file:// 和本地预览的 /v2/ 不补
  if (/^https?:$/.test(location.protocol) && !/\/$|\.html$/.test(location.pathname)) document.write('<base href="' + location.pathname + '/">');
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lyjw.me 运行原理</title>
<style>
@font-face{font-family:"Geist Mono";src:url(../fonts/GeistMono-Regular.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Geist Mono";src:url(../fonts/GeistMono-Medium.woff2) format("woff2");font-weight:500}
@font-face{font-family:"Geist Mono";src:url(../fonts/GeistMono-SemiBold.woff2) format("woff2");font-weight:600}
@font-face{font-family:"Geist Mono";src:url(../fonts/GeistMono-Bold.woff2) format("woff2");font-weight:700}
@font-face{font-family:"Geist";src:url(../fonts/Geist-Medium.woff2) format("woff2");font-weight:500}
@font-face{font-family:"Geist";src:url(../fonts/Geist-SemiBold.woff2) format("woff2");font-weight:600}
@font-face{font-family:"Geist";src:url(../fonts/Geist-Bold.woff2) format("woff2");font-weight:700}
@font-face{font-family:"Geist Pixel";src:url(../fonts/GeistPixel-Square.woff2) format("woff2")}
:root{--bg:#0d0c0a;--fg:#ebe8dc;--dim:#8d8980;--accent:#d97757}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:500 13px "Geist Mono",ui-monospace,monospace;overflow:hidden}
#wrap{position:fixed;inset:0 0 56px 0;display:flex;align-items:center;justify-content:center}
#gl{display:block;background:#000}
#bar{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 16px;border-top:1px solid #2a2824}
#bar button{background:none;border:1px solid #3a3731;color:var(--fg);font:inherit;height:30px;padding:0 12px;cursor:pointer}
#bar button:hover{border-color:var(--fg)}
#play{width:74px}
#scrub{position:relative;flex:1;height:30px;cursor:pointer}
#scrub .rail{position:absolute;left:0;right:0;top:14px;height:2px;background:#2f2c27}
#scrub .fill{position:absolute;left:0;top:14px;height:2px;background:var(--accent)}
#scrub .mark{position:absolute;top:8px;width:1px;height:14px;background:#5a564e}
#scrub .lab{position:absolute;top:-2px;font-size:10px;color:var(--dim);transform:translateX(4px);white-space:nowrap}
#time{min-width:104px;text-align:right;color:var(--dim)}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);pointer-events:none}
body.export #bar,body.export #load{display:none}
body.export #wrap{inset:0}
@media (max-width:600px){#bar{gap:8px;padding:0 8px}#time{min-width:0;font-size:11px}#scrub .lab{display:none}}
</style>
</head>
<body>
<div id="wrap"><canvas id="gl"></canvas></div>
<div id="bar">
  <button id="play" type="button">播放</button>
  <div id="scrub"><div class="rail"></div><div class="fill"></div></div>
  <span id="time">0:00 / 0:00</span>
  <button id="lang" type="button">English</button>
</div>
<div id="load">正在合成配乐…</div>
<!-- 顺序：章节表 → 配乐引擎和各章配乐 → 文字、引擎、组件 → 各章画面 → 时间轴。
     十一章的文件都已列好：还没写的会加载失败（onerror 吞掉），film.js 用占位顶上。章节作者不用改这个文件。 -->
<script>
  // 每项 [源相对路径, onerror]。用 document.write 按顺序载入：顶上补的 base 生效之后才解析这些相对路径（直接写 <script src>，预加载扫描器会先按根目录去取）。
  // 站点版由 scripts/build-explainer.mjs 读这张表（保持 JSON 写法），按内容哈希发布并注入 window.__assets（源相对路径 → 哈希路径）；
  // 还没写的章不发布，这里见 __assets 里没有就不载入。本地和渲染工具没有 __assets，用原名
  (() => {
    const LOAD = [
      ["plan.js"], ["../clawd.js"], ["score.js", "window.Score=null"],
      ["music/ch00.js", "0"], ["music/ch01.js", "0"], ["music/ch02.js", "0"], ["music/ch03.js", "0"], ["music/ch04.js", "0"],
      ["music/ch05.js", "0"], ["music/ch06.js", "0"], ["music/ch07.js", "0"], ["music/ch08.js", "0"], ["music/ch09.js", "0"], ["music/ch10.js", "0"],
      ["i18n.js"], ["engine.js"], ["kit.js"],
      ["ch00.js", "0"], ["ch01.js", "0"], ["ch02.js", "0"], ["ch03.js", "0"], ["ch04.js", "0"],
      ["ch05.js", "0"], ["ch06.js", "0"], ["ch07.js", "0"], ["ch08.js", "0"], ["ch09.js", "0"], ["ch10.js", "0"],
      ["film.js"]
    ];
    const A = window.__assets;
    for (const [f, onerror] of LOAD) {
      if (A && !A[f]) continue;
      document.write('<script src="' + (A ? A[f] : f) + '"' + (onerror ? ' onerror="' + onerror + '"' : "") + '><\/script>');
    }
  })();
</script>
</body>
</html>
