<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 744" width="864" height="744" role="img" aria-labelledby="title desc">
<title id="title">lyjwpage development workflow</title><desc id="desc">lyjw asks in the project chat, a coordinator Claude opens a thread, and the thread's Claude works with Devin CLI on lyjw's Mac and a Haiku verifier that signs receipts. Routines and visitor builds open PRs as well. Every change reaches main as a PR: branch preview, CI gates, bot review when needed and lyjw's OK, then Workers Builds deploys it.</desc>
