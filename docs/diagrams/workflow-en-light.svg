<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 696" width="864" height="696" role="img" aria-labelledby="title desc">
<title id="title">lyjwpage development workflow</title><desc id="desc">lyjw asks in the project chat, a coordinator Claude opens a thread, and the thread's Claude builds the change and has a Haiku verifier sign a receipt. Code-changing routines and visitor builds open PRs as well; the morning brief and the Anthropic digest only report. Every change reaches main as a PR: branch preview, CI gates, bot review when needed and lyjw's OK, then Workers Builds deploys it.</desc>
