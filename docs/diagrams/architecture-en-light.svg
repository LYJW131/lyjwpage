<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 864" width="864" height="864" role="img" aria-labelledby="title desc">
<title id="title">lyjwpage architecture</title><desc id="desc">Reporters post through Cloudflare Access to the ingress Worker, and the collector Worker polls outside services every minute. Both write the core Worker's Durable Objects for live state, KV for lag-tolerant snapshots and D1 for the archive; images go to R2. The site Worker reads KV directly and reads live state and pushes from core over Service Bindings to render lyjw.me, fronted by Alibaba ESA in mainland China. Chat, MCP and visitor builds go to the AI Worker, which calls the models and GitHub.</desc>
