<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 744" width="864" height="744" role="img" aria-labelledby="title desc">
<title id="title">lyjwpage 开发工作流</title><desc id="desc">lyjw 在项目聊天里说一句需求，协调 Claude 开线程，线程 Claude 借 Mac 上的 Devin CLI 并行实现、交 Haiku 验证员签回执；定时任务与访客构建也各自产出 PR。所有改动以 PR 进 main：分支预览、CI 门禁、按需的机器评审与 lyjw 点头之后合并，Workers Builds 自动部署。</desc>
