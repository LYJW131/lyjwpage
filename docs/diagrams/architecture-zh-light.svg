<title id="title">lyjwpage 系统架构</title><desc id="desc">采集端经 Cloudflare Access 上报到 ingress Worker，collector Worker 每分钟拉取外部服务；两者写入 core Worker 的 Durable Object 实时层、KV 可滞后快照与 D1 归档，图片进 R2。site Worker 直读 KV、经 Service Binding 读 core 的实时状态与推送，渲染 lyjw.me，中国大陆经阿里云 ESA；对话、MCP 与访客构建交给 AI Worker，它调用模型与 GitHub。</desc>
