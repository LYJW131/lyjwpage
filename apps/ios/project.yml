name: Lyjwpage
options:
  bundleIdPrefix: com.liangyangjunwei
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: none

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 2VTXNMR2GL
    MARKETING_VERSION: "3.0.0"
    CURRENT_PROJECT_VERSION: "8"
    GENERATE_INFOPLIST_FILE: NO
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  Lyjwpage:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: SharedUI
    dependencies:
      - target: LyjwpageWidgets
    settings:
      base:
        # bundle id 不随 App 改名：换了 HealthKit 授权、钥匙串里的 Access 密钥和描述文件都要重来。
        PRODUCT_BUNDLE_IDENTIFIER: com.liangyangjunwei.iPhoneTelemetryHub
        PRODUCT_NAME: Lyjwpage
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Lyjwpage.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - LyjwpageTests
        - LyjwpageUITests

  LyjwpageWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Core
        excludes:
          - "Live/**"
      - path: SharedUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liangyangjunwei.iPhoneTelemetryHub.Widgets
        PRODUCT_NAME: LyjwpageWidgets
        INFOPLIST_FILE: Widgets/Info.plist

  LyjwpageTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - "Fixtures/**"
      - path: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liangyangjunwei.iPhoneTelemetryHub.Tests
        GENERATE_INFOPLIST_FILE: YES

  LyjwpageUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Lyjwpage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liangyangjunwei.iPhoneTelemetryHub.UITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Lyjwpage
