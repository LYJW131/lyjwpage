# 每个非 main 分支一份只读影子。脚本名由 deploy-preview.mjs 按分支覆盖，
# 不要对这份配置直接 wrangler deploy：那会发到下面这个占位名上。
# 自己的空 SQLite，不挂生产域名、cron、KV、D1、R2，也不复制 Secret。
# 公开读取以 UPSTREAM_API_URL 的生产响应为主，生产没有的端点才用本分支。
name = "api-preview"
main = "src/index.ts"
compatibility_date = "2025-02-14"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]
workers_dev = true

[vars]
PREVIEW_WORKER = "true"
UPSTREAM_API_URL = "https://api.homepage.lyjw.llc"
STORAGE_PREFIX = "lyjwpage-preview"
ALLOWED_ORIGINS = "https://*.vercel.app"
EMBY_PUBLIC_URL = "https://emby.lyjw131.com"
APPLE_MUSIC_STOREFRONT = "cn"

[alias]
"@/lib/storage-driver" = "./src/storage-driver.ts"
"@/lib/apple-developer-token" = "./src/apple-developer-token.ts"

[[durable_objects.bindings]]
name = "LIVE_PUSH"
class_name = "LivePushRoom"

[[durable_objects.bindings]]
name = "STATE"
class_name = "StateHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LivePushRoom", "StateHub"]

[observability]
enabled = true
