# 独立迁移测试 Worker；小号 Vercel 已切换正式 api，此处不再绑定站点。
# 命名空间与生产完全独立；没有生产域名或 cron。
name = "ingest-do-test"
main = "src/index.ts"
compatibility_date = "2025-02-14"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]
workers_dev = true

[[services]]
binding = "READ_MODEL_RENDERER"
service = "ingest-do-test"
entrypoint = "ReadModelRenderer"

[vars]
STORAGE_PREFIX = "lyjwpage-test"
ALLOWED_ORIGINS = "https://*.vercel.app"
SITE_URL = "https://lyjwpage-do-test.vercel.app"
APPLE_MUSIC_STOREFRONT = "cn"
EMBY_PUBLIC_URL = "https://emby.lyjw131.com"
# 本地没有 Access：上报的 JWT 用 scripts/dev-access.mjs 生成的测试钥匙签，公钥放 .dev.vars 的 ACCESS_DEV_JWKS。
# 只有 team 域名是这个 .invalid 假地址时 Worker 才认那份公钥，见 src/access-auth.ts。
ACCESS_TEAM_DOMAIN = "https://access.local.invalid"
ACCESS_AUD = "local-dev"

[vars.ACCESS_CLIENTS]
"local-dev.access" = ["ingest:mac", "ingest:iphone", "ingest:homepod", "ingest:emby", "ingest:playstation", "ingest:server", "ingest:agents", "internal:site-deployed"]

[alias]
"@/lib/storage-driver" = "./src/storage-driver.ts"

[[durable_objects.bindings]]
name = "LIVE_PUSH"
class_name = "LivePushRoom"
[[durable_objects.bindings]]
name = "STATE"
class_name = "StateHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LivePushRoom", "OnlineCounterRoom", "StateHub"]

# 只有 HEAD 读取；测试上报使用模拟数据，不上传或修改生产图片。
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "lyjw-homepage"

[observability]
enabled = true

[[migrations]]
tag = "v2-split-online-counter"
deleted_classes = ["OnlineCounterRoom"]
