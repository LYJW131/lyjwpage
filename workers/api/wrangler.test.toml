# 本地开发用（根目录 `pnpm dev:worker` 以多配置方式和 dev-router、采集 Worker 一起起）。
# 名字与生产相同，别的本地 Worker 的 service binding 才按生产名字找到它；
# 状态全在本地的 --persist-to 目录里，与生产完全独立；没有生产域名或 cron。
name = "api"
main = "src/index.ts"
compatibility_date = "2025-02-14"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]
workers_dev = true

[[services]]
binding = "READ_MODEL_RENDERER"
service = "api"
entrypoint = "ReadModelRenderer"

[vars]
STORAGE_PREFIX = "lyjwpage-test"
ALLOWED_ORIGINS = "https://*.vercel.app"
SITE_URL = "https://lyjwpage-do-test.vercel.app"
APPLE_MUSIC_STOREFRONT = "cn"
EMBY_PUBLIC_URL = "https://emby.lyjw131.com"
# 本地没有 Access：上报的 JWT 用 scripts/dev-access.mjs 生成的测试钥匙签，公钥放 .dev.vars 的 ACCESS_DEV_JWKS。
# 只有 team 域名是这个 .invalid 假地址时 Worker 才认那份公钥，见 src/access-auth.ts。
ACCESS_TEAM_DOMAIN = "https://access.local.invalid"
ACCESS_AUD = "local-dev"

[vars.ACCESS_CLIENTS]
"local-dev.access" = ["ingest:mac", "ingest:iphone", "ingest:homepod", "ingest:emby", "ingest:playstation", "ingest:server", "ingest:agents", "ingest:agents-otlp", "internal:site-deployed"]

[alias]
"@/lib/storage-driver" = "./src/storage-driver.ts"
"@/lib/apple-music-credentials" = "./src/apple-music-credentials.ts"
"@/lib/lag-store" = "./src/lag-store.ts"

# 本地的凭据与可滞后层 KV，与生产不共用；多个本地 Worker 用同一个 id 才读得到彼此写的值
[[kv_namespaces]]
binding = "CREDENTIALS"
id = "00000000000000000000000000000002"

[[kv_namespaces]]
binding = "LAG"
id = "00000000000000000000000000000001"

[[durable_objects.bindings]]
name = "LIVE_PUSH"
class_name = "LivePushRoom"
[[durable_objects.bindings]]
name = "STATE"
class_name = "StateHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LivePushRoom", "OnlineCounterRoom", "StateHub"]

# 只有 HEAD 读取；测试上报使用模拟数据，不上传或修改生产图片。
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "lyjw-homepage"

[observability]
enabled = true

[[migrations]]
tag = "v2-split-online-counter"
deleted_classes = ["OnlineCounterRoom"]
