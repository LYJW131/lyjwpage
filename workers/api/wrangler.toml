name = "api"
main = "src/index.ts"
compatibility_date = "2025-02-14"
# Node 兼容用于 AsyncLocalStorage、crypto；process.env 为共用读写工具提供配置。
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]
workers_dev = true

# API、实时推送与连接数使用此源；可见人数由 online-counter 独立提供。
routes = [
  { pattern = "api.homepage.lyjw.llc", custom_domain = true }
]

[vars]
# 逗号分隔。实时推送、公开 API 的 CORS 和 MusicKit 令牌签发使用此名单。
# 对令牌它还是第二道限制：名单里写死的域会签进 JWT 的 origin 声明，由 Apple 校验，
# 令牌被复制到别的站点上也用不了。通配项只参与第一道（Apple 不解析通配符），
# 匹配到的预览域名和 localhost 只签它自己一个，见 src/musickit-token.ts。
ALLOWED_ORIGINS = "https://lyjw131.com,https://lyjw.me,https://dev.lyjw.me,https://*.vercel.app"
# MusicKit 签发用的 Team ID 和 Key ID 不是秘密；.p8 私钥走 secret，见 README。
APPLE_MUSIC_TEAM_ID = "2VTXNMR2GL"
APPLE_MUSIC_KEY_ID = "88KBJL3CKU"
# 令牌有效期（秒）。不填按 7 天，Apple 允许的上限是 15777000（约半年）。
# 续期不看这个数：过了「签发 → 到期」的中点就换一份新的，改这里不用调别处。
# MUSICKIT_TOKEN_TTL_SECONDS = "604800"
# 后端统一负责键前缀和公开地址；Vercel 只消费公开快照。
STORAGE_PREFIX = "lyjwpage"
R2_PUBLIC_BASE_URL = "https://r2.homepage.lyjw.llc"
EMBY_PUBLIC_URL = "https://emby.lyjw131.com"
# 处理完一次上报后回敲这份站点的 /api/revalidate
SITE_URL = "https://lyjw.me"
# lyjw131.com 经 ESA 回源 lyjw.me；内容变化只刷新首页缓存键。
ESA_SITE_ID = "1113300533463584"
ESA_CACHE_URL = "https://lyjw131.com/"
APPLE_MUSIC_STOREFRONT = "cn"

[alias]
"@/lib/storage-driver" = "./src/storage-driver.ts"

# LIVE_PUSH 数开着的页面（/ws，事件也从它广播），/count 返回 connections。
[[durable_objects.bindings]]
name = "LIVE_PUSH"
class_name = "LivePushRoom"




# 上报器直传图片的那个桶。这里只 HEAD，回执告诉上报器哪些图还没到
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "lyjw-homepage"

[observability]
enabled = true

# 秘密通过 wrangler secret put 配置：GITHUB_TOKEN、TELEMETRY_INGEST_SECRET、
# APPLE_MUSIC_PRIVATE_KEY（MusicKit 签发用的 .p8 全文）、
# ALIYUN_ACCESS_KEY_ID / ALIYUN_ACCESS_KEY_SECRET（ESA 首页刷新专用 RAM 用户）。
# 有页面连接时刷新最近在听，SQLite 闸门将 Apple 请求限制为两分钟一次。
[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "STATE"
class_name = "StateHub"


# 将原 ingest 的三个 SQLite 命名空间整体转移，保留对象 ID 与全部数据。
[[migrations]]
tag = "v1-transfer-from-ingest"

[[migrations.transferred_classes]]
from = "LivePushRoom"
from_script = "ingest"
to = "LivePushRoom"

[[migrations.transferred_classes]]
from = "OnlineCounterRoom"
from_script = "ingest"
to = "OnlineCounterRoom"

[[migrations.transferred_classes]]
from = "StateHub"
from_script = "ingest"
to = "StateHub"

[[migrations]]
tag = "v2-split-online-counter"
deleted_classes = ["OnlineCounterRoom"]
