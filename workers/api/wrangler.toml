name = "api"
main = "src/index.ts"
compatibility_date = "2025-02-14"
# Node 兼容用于 AsyncLocalStorage、crypto；process.env 为共用读写工具提供配置。
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]
workers_dev = true

# API、实时推送与连接数使用 api 源；可见人数由 online-counter 独立提供。
# ingest 源只收上报和内部通知，前面挡着 Cloudflare Access（应用「lyjwpage ingest」），
# 上报器凭各自的 service token 进来，Worker 再验 Access 签的 JWT，见 src/access-auth.ts。
routes = [
  { pattern = "api.homepage.lyjw.llc", custom_domain = true },
  { pattern = "ingest.homepage.lyjw.llc", custom_domain = true }
]

# playstation-reporter 经 Service Binding 调 PlaystationIngest 上报（见 src/playstation-ingest.ts），
# 这里不用声明：entrypoint 由调用方的 binding 指定。
# Loop back into this deployment's ordinary Worker isolate for public JSON rendering.
# This avoids ctx.exports (which needs a newer compatibility flag) and keeps StateHub focused on coordination.
[[services]]
binding = "READ_MODEL_RENDERER"
service = "api"
entrypoint = "ReadModelRenderer"

[vars]
# 逗号分隔。实时推送、公开 API 的 CORS 和 MusicKit 令牌签发使用此名单。
# 对令牌它还是第二道限制：名单里写死的域会签进 JWT 的 origin 声明，由 Apple 校验，
# 令牌被复制到别的站点上也用不了。通配项只参与第一道（Apple 不解析通配符），
# 匹配到的预览域名和 localhost 只签它自己一个，见 src/musickit-token.ts。
ALLOWED_ORIGINS = "https://lyjw131.com,https://lyjw.me,https://dev.lyjw.me,https://*.vercel.app"
# MusicKit 签发用的 Team ID 和 Key ID 不是秘密；.p8 私钥走 secret，见 README。
APPLE_MUSIC_TEAM_ID = "2VTXNMR2GL"
APPLE_MUSIC_KEY_ID = "88KBJL3CKU"
# 令牌有效期（秒）。不填按 7 天，Apple 允许的上限是 15777000（约半年）。
# 续期不看这个数：过了「签发 → 到期」的中点就换一份新的，改这里不用调别处。
# MUSICKIT_TOKEN_TTL_SECONDS = "604800"
# 后端统一负责键前缀；Vercel 只消费公开快照。
# 图片地址是 `/img/<对象键>` 同源路径（见 src/lib/asset-url.ts），Worker 不配交付域；
# 回源 R2 的地址只配在站点（Vercel 的 R2_PUBLIC_BASE_URL）和 ESA 上。
STORAGE_PREFIX = "lyjwpage"
EMBY_PUBLIC_URL = "https://emby.lyjw131.com"
# 处理完一次上报后回敲这份站点的 /api/revalidate
SITE_URL = "https://lyjw.me"
# lyjw131.com 经 ESA 回源 lyjw.me，首页按源站 SWR 头缓存，不走刷新 API。
APPLE_MUSIC_STOREFRONT = "cn"
# 站点卡片只读查询的归属标识，都不是秘密（账号 ID 也写在站点的控制台链接里）；
# 令牌走 secret：CLOUDFLARE_METRICS_TOKEN、VERCEL_TOKEN。
CLOUDFLARE_ACCOUNT_ID = "209f2c881b1c494fec50851c067b3266"
VERCEL_PROJECT_ID = "prj_r6sFPPmanb9zm3hzYAHAmp3KsIiC"
VERCEL_TEAM_ID = "team_kfTnkK6X9bbqSbkgAhq7SxCd"
# Sentry 的写入地址（DSN 本身公开，不是秘密）。本地 wrangler.test.toml 不配，本地就不上报。
SENTRY_DSN = "https://13ba806bda9ae5a9086576b2e3d23cfb@o4511888459890688.ingest.us.sentry.io/4512132602855424"
# Cloudflare Access：team 域名即 JWT 签发方，AUD 是「lyjwpage ingest」应用的受众标签。都不是秘密。
ACCESS_TEAM_DOMAIN = "https://lyjw2007.cloudflareaccess.com"
ACCESS_AUD = "a1557bcf1114491b462c7ee722ae97032405c43fa831812c8403e6d7366fba01"
PAIRING_ACCESS_AUD = "db3ea54c338e489eacad142600d745b3f55db421094e3f67a7fc6d6ef560004d"
PAIRING_EMAILS = "lyjw2007@gmail.com"

# 每把 service token（client id）能做什么。Access 策略只管「是不是这几把之一」，
# 写哪个来源由这张表定：拿 Emby 的 token 写 mac 会被拒成 403。client id 不是秘密；
# 新增 token 在 Zero Trust 控制台建好、加进策略，再把 client id 登记到这里。
[vars.ACCESS_CLIENTS]
"4ec7a9e98b7d3bc641c5eb97fddcb4f7.access" = ["ingest:mac"]                             # lyjwpage-mac
"8dfbbba29d501f75ff7763a598d6ada0.access" = ["ingest:iphone"]                          # lyjwpage-iphone
"01031f46aaeb93099ea40287f2c85f61.access" = ["ingest:emby"]                            # lyjwpage-emby
"fd30812b4dfd526c6ffd7801f07a6563.access" = ["ingest:server"]                          # lyjwpage-server
"ef47dda27da6a8428cee4cdebbf2951b.access" = ["ingest:agents"]                          # lyjwpage-agents
"04fb01940873a28a7ef42f9b5bfbad9d.access" = ["ingest:homepod", "ingest:playstation"]   # lyjwpage-home-assistant（HomePod 与 PS5 电源）
"c9437b45b762a36199e243df0df35ec4.access" = ["internal:site-deployed"]                 # lyjwpage-github-actions

# 配对登录（docs/reporter-pairing.md）：App 里点登录，过 Access 应用「lyjwpage pairing」
# （api.homepage.lyjw.llc/pair）确认后换回这个来源的 service token。AUD、邮箱、token ID 都不是秘密；
# PAIRING_KEY 与 CF_ACCESS_API_TOKEN（只有 Access: Service Tokens Write）走 secret。
[vars.PAIRING_SOURCES.mac]
tokenId = "269bc717-e328-47e2-b3c1-1516cea84ae1"
clientId = "4ec7a9e98b7d3bc641c5eb97fddcb4f7.access"
redirectUri = "mactelemetryhub://pair"
label = "Mac Telemetry Hub"

[vars.PAIRING_SOURCES.iphone]
tokenId = "b9635e38-3556-47fa-87ca-42f2a5abdbd3"
clientId = "8dfbbba29d501f75ff7763a598d6ada0.access"
redirectUri = "iphonetelemetryhub://pair"
label = "iPhone Telemetry Hub"

# Sentry 从这里取 release（Worker 版本 ID），和控制台的部署记录一一对应。
[version_metadata]
binding = "CF_VERSION_METADATA"

[alias]
"@/lib/storage-driver" = "./src/storage-driver.ts"
# developer token 只在这里签：站点侧同名模块是个只会抛错的桩
"@/lib/apple-developer-token" = "./src/apple-developer-token.ts"

# LIVE_PUSH 数开着的页面（/ws，事件也从它广播），/count 返回 connections。
[[durable_objects.bindings]]
name = "LIVE_PUSH"
class_name = "LivePushRoom"




# 上报器直传图片的那个桶。这里只 HEAD，回执告诉上报器哪些图还没到
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "lyjw-homepage"

# 公开读取投影（docs/kv-read-model.md）：DO SQLite 仍是唯一权威，这里只放可重建的公开 JSON。
# 去掉这个 binding 就回到纯 DO 读取，不需要反向迁移；生产、预览、本地不共用可写命名空间。
[[kv_namespaces]]
binding = "READ_MODEL"
id = "6d4a26ae1068417d8f9f7c200381826b"

# 长期活动历史归档（docs/state-storage.md）：StateHub 只留 7 天，这里只增不删。
[[d1_databases]]
binding = "HISTORY"
database_name = "lyjwpage-history"
database_id = "bf3a227f-d12e-428a-8f4e-0f56b97464df"

[observability]
enabled = true

# 秘密通过 wrangler secret put 配置：GITHUB_TOKEN、REVALIDATE_SECRET（调站点 /api/revalidate）、
# PAIRING_KEY / CF_ACCESS_API_TOKEN（配对登录）、
# TELEMETRY_INGEST_SECRET（过渡期的旧上报密钥，上报器都迁到 Access 后删除）、
# APPLE_MUSIC_PRIVATE_KEY（MusicKit 签发用的 .p8 全文）、CLOUDFLARE_METRICS_TOKEN
# （Workers 统计、部署与构建只读）、VERCEL_TOKEN（团队范围，部署与指标只读用）、
# PAGESPEED_API_KEY（Google PageSpeed Insights，cron 每小时实测一次首页性能）、
# TYPESAFE_API_KEY（TypeSafe AI 官方 API，给 pulse 六域打活动分的 Jev 评估模型；
# 不配就不打分，端点照常给泳道）、SENTRY_API_TOKEN（Sentry 组织只读令牌，
# org:read / project:read / event:read，给站点卡片的在线率、错误数取数；不配这几处就不显示）。
# 每分钟一趟：有页面连接时刷新最近在听（SQLite 闸门把 Apple 请求限制为两分钟一次），
# 并按同一把闸门每小时跑一次 PageSpeed 实测。厂商状态页也在这一分钟里拉，
# 只有结果变了才推送。
[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "STATE"
class_name = "StateHub"


# 将原 ingest 的三个 SQLite 命名空间整体转移，保留对象 ID 与全部数据。
# OnlineCounterRoom 写进 new_sqlite_classes，只为让 Wrangler 4 在 v2 删除它之前认得出这个类。
# 这个标签已经在生产生效，上传时不会再次执行。
[[migrations]]
tag = "v1-transfer-from-ingest"
new_sqlite_classes = ["OnlineCounterRoom"]

[[migrations.transferred_classes]]
from = "LivePushRoom"
from_script = "ingest"
to = "LivePushRoom"

[[migrations.transferred_classes]]
from = "OnlineCounterRoom"
from_script = "ingest"
to = "OnlineCounterRoom"

[[migrations.transferred_classes]]
from = "StateHub"
from_script = "ingest"
to = "StateHub"

[[migrations]]
tag = "v2-split-online-counter"
deleted_classes = ["OnlineCounterRoom"]

# 分支 Preview（wrangler preview）。不继承上面的生产绑定。
# Durable Object 每个 Preview 各有一套空库；代码走 env.STATE / env.LIVE_PUSH，所以绑定要再声明一次。
# 不挂 cron、生产域名、KV、D1、R2。公开读取靠 UPSTREAM_API_URL 以生产为准。
[previews.vars]
PREVIEW_WORKER = "true"
SENTRY_DSN = "https://13ba806bda9ae5a9086576b2e3d23cfb@o4511888459890688.ingest.us.sentry.io/4512132602855424"
UPSTREAM_API_URL = "https://api.homepage.lyjw.llc"
STORAGE_PREFIX = "lyjwpage-preview"
ALLOWED_ORIGINS = "https://*.vercel.app"
EMBY_PUBLIC_URL = "https://emby.lyjw131.com"
APPLE_MUSIC_STOREFRONT = "cn"

[[previews.durable_objects.bindings]]
name = "LIVE_PUSH"
class_name = "LivePushRoom"

[[previews.durable_objects.bindings]]
name = "STATE"
class_name = "StateHub"
