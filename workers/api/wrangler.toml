name = "api"
main = "src/index.ts"
compatibility_date = "2026-09-08"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env", "enable_request_signal"]
workers_dev = true

routes = [
  { pattern = "api.homepage.lyjw.llc", custom_domain = true }
]


[vars]
ALLOWED_ORIGINS = "https://lyjw131.com,https://lyjw.me,https://dev.lyjw.me,https://*.vercel.app"
APPLE_MUSIC_TEAM_ID = "2VTXNMR2GL"
APPLE_MUSIC_KEY_ID = "88KBJL3CKU"
STORAGE_PREFIX = "lyjwpage"
SITE_URL = "https://lyjw.me"
APPLE_MUSIC_STOREFRONT = "cn"
SENTRY_DSN = "https://13ba806bda9ae5a9086576b2e3d23cfb@o4511888459890688.ingest.us.sentry.io/4512132602855424"

[version_metadata]
binding = "CF_VERSION_METADATA"

[ai]
binding = "AI"

[alias]
"@/lib/storage-driver" = "./src/storage-driver.ts"
"@/lib/apple-developer-token" = "./src/apple-developer-token.ts"
"@/lib/apple-music-credentials" = "./src/apple-music-credentials.ts"
"@/lib/lag-store" = "./src/lag-store.ts"
"@/lib/apple-cache-store" = "./src/apple-cache-store.ts"

[[durable_objects.bindings]]
name = "LIVE_PUSH"
class_name = "LivePushRoom"

[[kv_namespaces]]
binding = "CREDENTIALS"
id = "c24d1670d97b4649ab5aa4c0944dfbfc"

[[kv_namespaces]]
binding = "LAG"
id = "e9c72a9517884aeb95db7386b630a691"

[[kv_namespaces]]
binding = "APPLE_CACHE"
id = "da83c6ece9694300b707cb87c915610c"

[[d1_databases]]
binding = "HISTORY"
database_name = "lyjwpage-history"
database_id = "bf3a227f-d12e-428a-8f4e-0f56b97464df"

[observability]
enabled = true

[triggers]
crons = ["2,7,12,17,22,27,32,37,42,47,52,57 * * * *"]

[[durable_objects.bindings]]
name = "STATE"
class_name = "StateHub"

[[durable_objects.bindings]]
name = "CHAT_QUOTA"
class_name = "ChatQuota"

[[durable_objects.bindings]]
name = "ANTHROPIC_EGRESS"
class_name = "AnthropicEgress"

# /api/chat/usage 按 IP 限流；namespace_id 在整个 Cloudflare 账号里唯一，别的 Worker 不要复用。
[[ratelimits]]
name = "CHAT_USAGE_LIMIT"
namespace_id = "13101"
simple = { limit = 30, period = 10 }
# /api/github/issue 按 IP 限流，GitHub 自己也会拦刷屏。
[[ratelimits]]
name = "GITHUB_ISSUE_LIMIT"
namespace_id = "13102"
simple = { limit = 5, period = 60 }

# Wrangler 必须先认识 OnlineCounterRoom，后续删除迁移才可生效。
[[migrations]]
tag = "v1-transfer-from-ingest"
new_sqlite_classes = ["OnlineCounterRoom"]

[[migrations.transferred_classes]]
from = "LivePushRoom"
from_script = "ingest"
to = "LivePushRoom"

[[migrations.transferred_classes]]
from = "OnlineCounterRoom"
from_script = "ingest"
to = "OnlineCounterRoom"

[[migrations.transferred_classes]]
from = "StateHub"
from_script = "ingest"
to = "StateHub"

[[migrations]]
tag = "v2-split-online-counter"
deleted_classes = ["OnlineCounterRoom"]

[[migrations]]
tag = "v3-chat-quota"
new_sqlite_classes = ["ChatQuota"]

[[migrations]]
tag = "v4-anthropic-egress"
new_sqlite_classes = ["AnthropicEgress"]

# Preview 不继承生产绑定，要用的绑定（DO、AI、限流）都得在下面重声明。
[previews.vars]
PREVIEW_WORKER = "true"
SENTRY_DSN = "https://13ba806bda9ae5a9086576b2e3d23cfb@o4511888459890688.ingest.us.sentry.io/4512132602855424"
UPSTREAM_API_URL = "https://api.homepage.lyjw.llc"
STORAGE_PREFIX = "lyjwpage-preview"
ALLOWED_ORIGINS = "https://*.vercel.app"
APPLE_MUSIC_STOREFRONT = "cn"

[[previews.durable_objects.bindings]]
name = "LIVE_PUSH"
class_name = "LivePushRoom"

[[previews.durable_objects.bindings]]
name = "STATE"
class_name = "StateHub"

[[previews.durable_objects.bindings]]
name = "CHAT_QUOTA"
class_name = "ChatQuota"

[[previews.durable_objects.bindings]]
name = "ANTHROPIC_EGRESS"
class_name = "AnthropicEgress"

[previews.ai]
binding = "AI"

[[previews.ratelimits]]
name = "CHAT_USAGE_LIMIT"
namespace_id = "13101"
simple = { limit = 30, period = 10 }

[[previews.ratelimits]]
name = "GITHUB_ISSUE_LIMIT"
namespace_id = "13102"
simple = { limit = 5, period = 60 }
