name = "am-motion-artwork"
main = "src/index.ts"
compatibility_date = "2024-01-01"
workers_dev = true

routes = [
  { pattern = "am-motion-artwork.homepage.lyjw.llc", custom_domain = true }
]

[vars]
# lyjw.me = Vercel 生产，lyjw131.com = EdgeOne 生产，dev.lyjw.me = 预览。
# 和 live-push / online-counter / musickit-token 那三份是同一个名单，
# 加域名时四个 worker 都要改、都要重新部署。
# 留空 = 不限来源（只为 `wrangler dev` 留的）；这个 worker 从前就是那么裸奔的，
# 谁都能拿它当免费的 Apple Music 目录代理用。
ALLOWED_ORIGINS = "https://lyjw.me,https://lyjw131.com,https://dev.lyjw.me,https://*.vercel.app"

[observability]
enabled = true
