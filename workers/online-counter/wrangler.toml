name = "online-counter"
main = "src/index.ts"
compatibility_date = "2024-12-30"
workers_dev = true

routes = [
  { pattern = "online.homepage.lyjw.llc", custom_domain = true }
]

[vars]
# lyjw.me = Vercel 生产，lyjw131.com = EdgeOne 生产，dev.lyjw.me = 预览。
# 和 live-push / musickit-token / am-motion-artwork 那三份是同一个名单，
# 加域名时四个 worker 都要改、都要重新部署。
ALLOWED_ORIGINS = "https://lyjw.me,https://lyjw131.com,https://dev.lyjw.me,https://*.vercel.app"

[[durable_objects.bindings]]
name = "ONLINE_COUNTER"
class_name = "OnlineCounterRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OnlineCounterRoom"]


[observability]
enabled = true
