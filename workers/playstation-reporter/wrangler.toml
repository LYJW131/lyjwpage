name = "playstation-reporter"
main = "src/index.ts"
# 按 UTC 取，写本地今天（UTC+8 快一天）会被 API 按「未来日期」拒掉
compatibility_date = "2026-08-24"
workers_dev = true

routes = [
  { pattern = "playstation-reporter.homepage.lyjw.llc", custom_domain = true }
]

[triggers]
# 每分钟只是「看一眼门」，不等于每分钟跑一轮：站点有页面开着才 2 分钟一轮完整
# tick，一个都没有时门把节奏压回 15 分钟，对 PSN 的闲时流量和从前一样。
crons = ["* * * * *"]

[vars]
PSN_LANGUAGE = "zh-Hans"
PSN_ACCOUNT_ID = "me"
PLAYED_GAMES_LIMIT = "100"
# 三角洲行动、明日方舟：终末地
PLAYSTATION_HIDDEN_TITLE_IDS = "PPSA28884_00,PPSA18538_00"
# Cloudflare 全球网络直连 Vercel 主站，EdgeOne 由站点 ingest 中继同步。
SITE_URL = "https://lyjw.me"
# SITE_INGEST_URL = "https://lyjw131.com/api/ingest/playstation"
# live-push worker 的源，门读它的 /count 定节奏 —— 那个数是「开着本站的页面数」
# （含后台标签页），不是 online-counter 那个「此刻可见的人头」。填源不填路径，和
# 站点侧的 NEXT_PUBLIC_LIVE_PUSH_URL 同一个形状。不配就一路走 15 分钟的基线节奏。
LIVE_PUSH_URL = "https://live.homepage.lyjw.llc"

[[kv_namespaces]]
binding = "STATE"
id = "0f9b584f71634776ba3bc081a7aa4498"

[observability]
enabled = true
