name = "playstation-reporter"
main = "src/index.ts"
compatibility_date = "2026-08-25"
workers_dev = true

routes = [
  { pattern = "playstation-reporter.homepage.lyjw.llc", custom_domain = true }
]

[triggers]
crons = ["*/15 * * * *"]

[vars]
PSN_LANGUAGE = "zh-Hans"
PSN_ACCOUNT_ID = "me"
PLAYED_GAMES_LIMIT = "20"
# 站点侧 /api/ingest/playstation 实现后，二选一取消注释。都不配就是 dry-run。
# SITE_URL = "https://lyjw131.com"
# SITE_INGEST_URL = "https://lyjw131.com/api/ingest/playstation"

[[kv_namespaces]]
binding = "STATE"
id = "0f9b584f71634776ba3bc081a7aa4498"

[observability]
enabled = true
