name = "ai"
main = "src/index.ts"
compatibility_date = "2026-10-09"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env", "enable_request_signal"]
workers_dev = false
preview_urls = true

[vars]
ALLOWED_ORIGINS = "https://lyjw131.com,https://lyjw.me,https://dev.lyjw.me,https://*.vercel.app"
SENTRY_DSN = "https://13ba806bda9ae5a9086576b2e3d23cfb@o4511888459890688.ingest.us.sentry.io/4512132602855424"
# 设计会话的 Managed Agents 壳，必须与 ANTHROPIC_API_KEY 在同一个 Console 工作空间（见 docs/ops-facts.md）。
DESIGN_AGENT_ID = "agent_01A9iz5Qv92DM3v6AgZvwo59"
DESIGN_ENVIRONMENT_ID = "env_01P1faxn2fwzNE596uk9JzgM"
VERCEL_TEAM_ID = "team_kfTnkK6X9bbqSbkgAhq7SxCd"

# 删除过期的设计会话，见 src/chat/design-cleanup.ts。
[triggers]
crons = ["*/15 * * * *"]

[version_metadata]
binding = "CF_VERSION_METADATA"

[ai]
binding = "AI"

[[services]]
binding = "PUBLIC_STATUS"
service = "api"
entrypoint = "PublicStatus"

[[worker_loaders]]
binding = "LOADER"

# 与上报入口同一个站点图片桶：构建截图按内容寻址写入，经站点 /img/<objectKey> 进 PR 评论。
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "lyjw-homepage"

[[durable_objects.bindings]]
name = "CHAT_QUOTA"
class_name = "ChatQuota"

[[durable_objects.bindings]]
name = "ANTHROPIC_EGRESS"
class_name = "AnthropicEgress"

[[durable_objects.bindings]]
name = "BUILD_COORDINATOR"
class_name = "BuildCoordinator"

[[migrations]]
tag = "v1-transfer-from-api"

[[migrations.transferred_classes]]
from = "ChatQuota"
from_script = "api"
to = "ChatQuota"

[[migrations.transferred_classes]]
from = "AnthropicEgress"
from_script = "api"
to = "AnthropicEgress"

[[migrations]]
tag = "v2-build-coordinator"
new_sqlite_classes = ["BuildCoordinator"]

[[ratelimits]]
name = "CHAT_USAGE_LIMIT"
namespace_id = "13101"
simple = { limit = 30, period = 10 }

[[ratelimits]]
name = "GITHUB_ISSUE_LIMIT"
namespace_id = "13102"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "MCP_LIMIT"
namespace_id = "13103"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "BUILD_REQUEST_LIMIT"
namespace_id = "13104"
simple = { limit = 30, period = 60 }

[observability]
enabled = true
