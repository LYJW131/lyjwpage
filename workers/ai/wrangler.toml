name = "ai"
main = "src/index.ts"
upload_source_maps = true
compatibility_date = "2026-10-09"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env", "enable_request_signal", "global_fetch_strictly_public"]
workers_dev = false
preview_urls = false

[vars]
ALLOWED_ORIGINS = "https://lyjw131.com,https://lyjw.me,https://dev.lyjw.me"
# 设计会话的 Managed Agents 壳，必须与 ANTHROPIC_API_KEY 在同一个 Console 工作空间（见 docs/ops-facts.md）。
DESIGN_AGENT_ID = "agent_01A9iz5Qv92DM3v6AgZvwo59"
DESIGN_ENVIRONMENT_ID = "env_01P1faxn2fwzNE596uk9JzgM"

# 删除过期的设计会话，见 src/chat/design-cleanup.ts。
[triggers]
crons = ["*/15 * * * *"]

[version_metadata]
binding = "CF_VERSION_METADATA"

[ai]
binding = "AI"

[[services]]
binding = "PUBLIC_STATUS"
service = "core"
entrypoint = "PublicStatus"

# 只读不公开的长期历史，只在 /mcp 带着 lyjw 的 OAuth 令牌时才调（src/oauth/server.ts）。
[[services]]
binding = "PRIVATE_HISTORY"
service = "core"
entrypoint = "PrivateHistory"

# Code Mode 的沙箱（src/tools/code-sandbox.ts），只有连 /mcp?codemode 的客户端会用到。
[[worker_loaders]]
binding = "LOADER"

# workers-oauth-provider 的授权、令牌与客户端登记（src/oauth/server.ts）。
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "c17f49a72cff4523ac5e0f38e68f6111"

# 与上报入口同一个站点图片桶：构建截图按内容寻址写入，经站点 /img/<objectKey> 进 PR 评论。
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "lyjw-homepage"

[[durable_objects.bindings]]
name = "CHAT_QUOTA"
class_name = "ChatQuota"

[[durable_objects.bindings]]
name = "ANTHROPIC_EGRESS"
class_name = "AnthropicEgress"

[[durable_objects.bindings]]
name = "BUILD_COORDINATOR"
class_name = "BuildCoordinator"

# 首页对话记录，保留期见 src/chat/transcripts.ts#TRANSCRIPT_RETENTION_MS；分支预览不绑，不记。
[[durable_objects.bindings]]
name = "CHAT_LOG"
class_name = "ChatLog"

[[migrations]]
tag = "v1-transfer-from-api"

[[migrations.transferred_classes]]
from = "ChatQuota"
from_script = "api"
to = "ChatQuota"

[[migrations.transferred_classes]]
from = "AnthropicEgress"
from_script = "api"
to = "AnthropicEgress"

[[migrations]]
tag = "v2-build-coordinator"
new_sqlite_classes = ["BuildCoordinator"]

[[migrations]]
tag = "v3-chat-log"
new_sqlite_classes = ["ChatLog"]

[[ratelimits]]
name = "CHAT_USAGE_LIMIT"
namespace_id = "13101"
simple = { limit = 30, period = 10 }

[[ratelimits]]
name = "MCP_LIMIT"
namespace_id = "13103"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "BUILD_REQUEST_LIMIT"
namespace_id = "13104"
simple = { limit = 30, period = 60 }

[observability]
enabled = true

[observability.traces]
enabled = true
head_sampling_rate = 0.01

[observability.issues]
enabled = true
