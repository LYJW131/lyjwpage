name = "live-push"
main = "src/index.ts"
compatibility_date = "2025-02-14"
workers_dev = true

routes = [
  { pattern = "live.homepage.lyjw.llc", custom_domain = true }
]

[vars]
ALLOWED_ORIGINS = "https://lyjw131.com,https://lyjw.me,https://dev.lyjw.me,https://*.vercel.app"

[[durable_objects.bindings]]
name = "LIVE_PUSH"
class_name = "LivePushRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LivePushRoom"]

[observability]
enabled = true

# LIVE_PUSH_SECRET 不写在这里，用 `wrangler secret put LIVE_PUSH_SECRET` 存进去 ——
# 站点带着同一个值 POST /publish。没配的话 /publish 一律 503。
