# 本地名字须与 Service Binding 的生产名字一致，其他 Worker 才能找到它。
name = "core"
main = "src/index.ts"
compatibility_date = "2026-09-08"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env", "enable_request_signal"]
workers_dev = true

[[services]]
binding = "AI_SERVICE"
service = "ai"

[[services]]
binding = "DEV_OVERRIDE_READER"
service = "core"
entrypoint = "DevOverrideReader"

[vars]
STORAGE_PREFIX = "lyjwpage-test"
ALLOWED_ORIGINS = "https://*.lyjw.workers.dev"

# 跨本地 Worker 共享 KV 必须使用同一个 id。
[[kv_namespaces]]
binding = "LAG"
id = "00000000000000000000000000000001"

# 本地空库；归档写入照样被 historyArchive 的闸门挡住，只给读归档的端点用。
[[d1_databases]]
binding = "HISTORY"
database_name = "lyjwpage-history"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "LIVE_PUSH"
class_name = "LivePushRoom"
[[durable_objects.bindings]]
name = "STATE"
class_name = "StateHub"
[[migrations]]
tag = "v1"
new_sqlite_classes = ["LivePushRoom", "StateHub"]

[ai]
binding = "AI"

[observability]
enabled = true
