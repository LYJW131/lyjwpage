name = "collector"
main = "src/index.ts"
compatibility_date = "2026-09-08"
# src/lib 下的取数模块读 process.env（令牌、项目 ID、键前缀），所以两个开关都要
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]
# 没有路由也没有域名：只跑 cron，另开一个具名 entrypoint `Collector` 给同账号的 Worker 调
workers_dev = false

[triggers]
# 每分钟一响，各个任务按自己的节奏（src/registry.ts 的登记表）决定这一响跑不跑；
# PlayStation 另有一道看人头数的门，见 README。
crons = ["* * * * *"]

[vars]
STORAGE_PREFIX = "lyjwpage"
PSN_LANGUAGE = "zh-Hans"
PSN_ACCOUNT_ID = "me"
PLAYED_GAMES_LIMIT = "100"
# 三角洲行动、明日方舟：终末地
PLAYSTATION_HIDDEN_TITLE_IDS = "PPSA28884_00,PPSA18538_00"
APPLE_MUSIC_STOREFRONT = "cn"
# 站点卡片只读查询的归属标识，都不是秘密；令牌走 secret（见文末）。
CLOUDFLARE_ACCOUNT_ID = "209f2c881b1c494fec50851c067b3266"
VERCEL_PROJECT_ID = "prj_r6sFPPmanb9zm3hzYAHAmp3KsIiC"
VERCEL_TEAM_ID = "team_kfTnkK6X9bbqSbkgAhq7SxCd"
# Sentry 项目 collector-worker 的写入地址（DSN 公开，不是秘密）。本地 wrangler.test.toml 不配。
SENTRY_DSN = "https://23b24c339292701f7b84adea24780773@o4511888459890688.ingest.us.sentry.io/4512164070948864"

# 状态核心（api Worker）对内的 RPC，契约见 shared/state-core.ts：
# PlayStation 上报、连接数、电源、Apple developer token、最近在听落库、首屏失效。
[[services]]
binding = "CORE"
service = "api"
entrypoint = "StateCore"

# 采集 Worker 自己的状态：PSN 登录（auth，refresh token 约 10 天）、指纹、奖杯目录、
# 游玩列表缓存，以及 src/lib/cache 的键（`lyjwpage:cache:*`）。沿用原 playstation-reporter
# 的命名空间，不迁数据、不用重新登录 PSN。
[[kv_namespaces]]
binding = "COLLECTOR_KV"
id = "0f9b584f71634776ba3bc081a7aa4498"

# 可滞后层（shared/lag.ts）：只展示、不参与计算的结果直接写这里，成功才写。
[[kv_namespaces]]
binding = "LAG"
id = "e9c72a9517884aeb95db7386b630a691"

# 共享凭据（shared/credentials.ts）：只读 Mac 推来的 Apple Music user token。
[[kv_namespaces]]
binding = "CREDENTIALS"
id = "c24d1670d97b4649ab5aa4c0944dfbfc"

# 长期归档：奖杯（trophies）与站点部署（site_deploys）。表结构归 workers/api/migrations 管，
# 这里不设 migrations_dir；新表先在 api 那边 `wrangler d1 migrations apply` 再发布本 Worker。
[[d1_databases]]
binding = "HISTORY"
database_name = "lyjwpage-history"
database_id = "bf3a227f-d12e-428a-8f4e-0f56b97464df"

[alias]
# 站点侧同名模块是只会抛错的桩：developer token 经 CORE 取，user token 读凭据 KV
"@/lib/storage-driver" = "./src/storage-driver.ts"
"@/lib/apple-developer-token" = "./src/apple-developer-token.ts"
"@/lib/apple-music-credentials" = "./src/apple-music-credentials.ts"

# Sentry 从这里取 release（Worker 版本 ID）
[version_metadata]
binding = "CF_VERSION_METADATA"

[observability]
enabled = true

# 秘密通过 wrangler secret put 配置，缺哪个就跳过哪个任务（每个 isolate 只警告一次）：
# PSN_NPSSO（KV 里的 refresh token 过期时才用）、GITHUB_TOKEN（classic PAT）、
# VERCEL_TOKEN（团队范围只读用）、CLOUDFLARE_METRICS_TOKEN（Workers 统计、部署与构建只读）、
# SENTRY_API_TOKEN（org:read / project:read / event:read）、PAGESPEED_API_KEY。
