services:
  emby-reporter:
    image: ghcr.io/lyjw131/emby-reporter:latest
    container_name: emby-reporter
    restart: unless-stopped
    ports:
      - "${WEBHOOK_HOST_PORT:-8787}:${WEBHOOK_PORT:-8787}"
    environment:
      EMBY_URL: ${EMBY_URL}
      EMBY_API_KEY: ${EMBY_API_KEY}
      EMBY_USER_ID: ${EMBY_USER_ID}
      SITE_INGEST_URL: ${SITE_INGEST_URL}
      ACCESS_CLIENT_ID: ${ACCESS_CLIENT_ID}
      ACCESS_CLIENT_SECRET: ${ACCESS_CLIENT_SECRET}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_BUCKET: ${R2_BUCKET}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      WEBHOOK_PORT: ${WEBHOOK_PORT:-}
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN:-}
      RESUME_INTERVAL_MS: ${RESUME_INTERVAL_MS:-}
      RESUME_LIMIT: ${RESUME_LIMIT:-}
      SESSION_ACTIVE_INTERVAL_MS: ${SESSION_ACTIVE_INTERVAL_MS:-}
      SESSION_IDLE_INTERVAL_MS: ${SESSION_IDLE_INTERVAL_MS:-}
      WAKE_WINDOW_MS: ${WAKE_WINDOW_MS:-}
      SEEK_TOLERANCE_MS: ${SEEK_TOLERANCE_MS:-}
      REANCHOR_MS: ${REANCHOR_MS:-}
      FULL_PUSH_INTERVAL_MS: ${FULL_PUSH_INTERVAL_MS:-}
      IMAGES_PER_PUSH: ${IMAGES_PER_PUSH:-}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-}
      PUSH_TIMEOUT_MS: ${PUSH_TIMEOUT_MS:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
