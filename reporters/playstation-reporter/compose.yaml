# 部署单元。把这个目录整个拷到要跑它的机器上，旁边放一份 .env（含 NPSSO，别进仓库），
# 然后 `docker compose up -d --build`。完整步骤见 README。
#
# 自成一个 compose project（项目名取自目录名），不要并进别的 compose 文件 ——
# 同一个 project 里 `up` 会顺带重建兄弟容器。
#
# 不开端口：它只往外发请求，没有任何入站接口。

services:
  playstation-reporter:
    build: .
    image: playstation-reporter
    container_name: playstation-reporter
    restart: unless-stopped
    environment:
      # 手工从浏览器取的那串，见 README。没有它、状态卷里也没有可用的 refresh token
      # 时，容器起来就会以「缺少环境变量 PSN_NPSSO」退出
      PSN_NPSSO: ${PSN_NPSSO:-}
      PSN_ACCOUNT_ID: ${PSN_ACCOUNT_ID:-}
      # 不填就是默认的 ./state/auth.json，正好落在下面那个卷里
      PSN_STATE_FILE: ${PSN_STATE_FILE:-}
      # 站点侧的 /api/ingest/playstation 还不存在，所以这两个留空跑 dry-run，
      # 信封只打进 docker logs
      SITE_URL: ${SITE_URL:-}
      SITE_INGEST_URL: ${SITE_INGEST_URL:-}
      TELEMETRY_INGEST_SECRET: ${TELEMETRY_INGEST_SECRET:-}
      PLAYED_GAMES_LIMIT: ${PLAYED_GAMES_LIMIT:-}
      PRESENCE_INTERVAL_MS: ${PRESENCE_INTERVAL_MS:-}
      PLAYED_GAMES_INTERVAL_MS: ${PLAYED_GAMES_INTERVAL_MS:-}
      FULL_PUSH_INTERVAL_MS: ${FULL_PUSH_INTERVAL_MS:-}
      RETRY_MS: ${RETRY_MS:-}
      MAX_RETRY_MS: ${MAX_RETRY_MS:-}
      PUSH_TIMEOUT_MS: ${PUSH_TIMEOUT_MS:-}
    volumes:
      # refresh token 活约两个月，得跨重启留着 —— 丢了就要人再去浏览器抠一次 NPSSO。
      # 挂在 /app/state 而不是 /state：镜像里那个目录已经 chown 给 node 了
      - playstation-state:/app/state
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  playstation-state:
