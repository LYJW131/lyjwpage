services:
  playstation-reporter:
    image: ghcr.io/lyjw131/playstation-reporter:latest
    container_name: playstation-reporter
    restart: unless-stopped
    network_mode: host
    init: true
    user: "1026:101"
    environment:
      SITE_INGEST_URL: ${SITE_INGEST_URL}
      ACCESS_CLIENT_ID: ${ACCESS_CLIENT_ID}
      ACCESS_CLIENT_SECRET: ${ACCESS_CLIENT_SECRET}
      PSN_NPSSO: ${PSN_NPSSO:-}
      PS5_HOST: ${PS5_HOST}
      DATA_DIR: /data
      PSN_LANGUAGE: ${PSN_LANGUAGE:-zh-Hans}
      PSN_ACCOUNT_ID: ${PSN_ACCOUNT_ID:-me}
      PLAYED_GAMES_LIMIT: ${PLAYED_GAMES_LIMIT:-100}
      PLAYSTATION_HIDDEN_TITLE_IDS: ${PLAYSTATION_HIDDEN_TITLE_IDS:-PPSA28884_00,PPSA18538_00}
      PS_DRY_RUN: ${PS_DRY_RUN:-}
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
