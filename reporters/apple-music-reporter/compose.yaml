# 部署单元。把这个目录整个拷到要跑它的机器上，旁边放一份 .env（含密钥，别进仓库），
# 然后 `docker compose up -d --build`。完整步骤见 README。
#
# 自成一个 compose project（项目名取自目录名），不要并进别的 compose 文件 ——
# 同一个 project 里 `up` 会顺带重建兄弟容器。
#
# 不开端口：它只往外发请求，没有任何入站接口。

services:
  apple-music-reporter:
    build: .
    image: apple-music-reporter
    container_name: apple-music-reporter
    restart: unless-stopped
    environment:
      SITE_URL: ${SITE_URL}
      SITE_INGEST_URL: ${SITE_INGEST_URL:-}
      # 站点没配同名变量时可以空着，那时它既不校验上报也不校验取凭据
      TELEMETRY_INGEST_SECRET: ${TELEMETRY_INGEST_SECRET:-}
      APPLE_MUSIC_STOREFRONT: ${APPLE_MUSIC_STOREFRONT:-}
      RECENT_INTERVAL_MS: ${RECENT_INTERVAL_MS:-}
      FULL_PUSH_INTERVAL_MS: ${FULL_PUSH_INTERVAL_MS:-}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-}
      PUSH_TIMEOUT_MS: ${PUSH_TIMEOUT_MS:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
