name: lyjwpage-reporters

services:
  agents-reporter:
    image: ghcr.io/lyjw131/agents-reporter:latest
    container_name: agents-reporter
    restart: unless-stopped
    env_file:
      - ./agents-reporter/.env
    volumes:
      - ./agents-reporter/data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  server-reporter:
    image: ghcr.io/lyjw131/server-reporter:latest
    container_name: server-reporter
    restart: unless-stopped
    # 网卡与流量必须来自宿主机网络命名空间，容器桥接网络会报出自己的接口。
    network_mode: host
    env_file:
      - ./server-reporter/.env
    environment:
      HOST_ROOT: /host
    volumes:
      - /etc:/host/etc:ro
      # /etc/os-release 可能指向 /usr/lib；单挂 /etc 会断链，单独 bind 让宿主机先解链接。
      - /etc/os-release:/host/etc/os-release:ro
      - ./server-reporter/data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
